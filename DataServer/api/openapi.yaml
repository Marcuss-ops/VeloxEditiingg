info:
    contact:
        name: Velox architecture
        url: https://github.com/example/velox
    description: |
        The Velox Master exposes a small, authenticated HTTP API for
        programmatic intake of creator-built payloads and for orchestrator
        control. All POST endpoints under `/api/v1/` and `/api/` (master
        pipeline group) are protected by a single bearer-token middleware
        keyed on the `VELOX_ADMIN_TOKEN` environment variable.

        This revision focuses on the new **creator_push** intake path
        (`POST /api/v1/creator/jobs`) introduced alongside the existing
        async `CreatorForwardingRunner` poller. Both intake paths converge
        on the canonical `creatorflow.Resolver` (the unique writer of
        `creator_forwardings`/`jobs`/`tasks`); the push handler does NOT
        open its own transaction or duplicate schema. See
        `docs/architecture/current-architecture.md` §12 and §4.2 of
        `docs/architecture/runtime-invariants.md` for the invariant.

        The HTTP contract is also documented narratively in
        `docs/CREATOR-PUSH.md`. Whenever the two disagree, the tested
        behavior in `DataServer/internal/handlers/server/pipeline/creator_push_e2e_test.go`
        is the source of truth.

        NOTE ON SCHEMA REDUNDANCY: this spec declares BOTH `CreatorPushPayload`
        (the flat wire-facing schema the Creator machine sends) and
        `RemotePipelineResult` (the nested typed DTO that the handler
        reconstructs via `remoteengine.ParseRemotePipelineResult`, with the
        flat→nested mapping rules documented under the `x-flat-to-dto`
        extension on the latter). The wire format is `CreatorPushPayload`;
        `RemotePipelineResult` is documented for completeness + parser
        cross-checking.
    license:
        name: Proprietary
    summary: Contract for Velox Master endpoints, with focus on the creator_push intake.
    title: Velox Master HTTP API
    version: 0.6.0-creatorpush-v3
openapi: 3.1.0
paths:
    /api/v1/creator/jobs:
        post:
            description: |
                Synchronous intake for Creator machines. The handler
                `creator_push` accepts a `CreatorPushPayload`-shaped
                payload, converts it to the typed `RemotePipelineResult`
                DTO via `remoteengine.ParseRemotePipelineResult`, and
                delegates to the canonical `creatorflow.Resolver`. Replays
                with the same
                `source_provider + source_job_id + target_executor_id` are
                **idempotent**: they converge to the same Velox job and the
                same `dispatch_status` overlay.

                The handler does NOT open a parallel database transaction:
                `creator_forwardings`, `jobs` and `tasks` are written exactly
                once, inside `AtomicForwardAndEnqueue`. See
                `docs/architecture/runtime-invariants.md §4.2` for the
                invariant.

                `accepted_from` in the response is the canonical way for
                callers (and for our Prometheus metric
                `pipeline_creator_intake_accepted_total{path=…}`) to split
                the sync push from the async `creator_forwarder` poller.

                Tested end-to-end by
                `DataServer/internal/handlers/server/pipeline/creator_push_e2e_test.go`
                and smoke-tested by `scripts/creator_push_smoke.sh`.
            operationId: pushCreatorJob
            parameters:
                - $ref: '#/components/parameters/AuthorizationHeader'
                - $ref: '#/components/parameters/XRequestIDHeader'
            requestBody:
                content:
                    application/json:
                        examples:
                            basic_voiceover_stock_clip_scene:
                                summary: Voiceover + stock + clip + scene (the canonical Creator flow).
                                value:
                                    payload:
                                        delivery_plan:
                                            - destination_id: drive
                                              priority: 1
                                              retry_budget: 3
                                        job_id: creator-job-001
                                        scenes:
                                            - clip_link: velox-asset://clips/aqueduct-clip-01.mp4
                                              duration_seconds: 7
                                              text: Apertura sugli acquedotti
                                            - clip_link: velox-asset://clips/aqueduct-clip-02.mp4
                                              duration_seconds: 9
                                              text: Dettaglio arco in pietra
                                        script_text: In questo video scopriremo gli acquedotti romani.
                                        status: completed
                                        video_name: Aqueducts of Rome
                                        voiceover_paths:
                                            - velox-asset://voiceovers/intro.mp3
                                    source_job_id: creator-job-001
                                    source_provider: creator_pc_1
                                    target_executor_id: scene.composite.v1
                        schema:
                            $ref: '#/components/schemas/CreatorPushRequest'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            examples:
                                accepted:
                                    value:
                                        accepted_from: creator_push
                                        dispatch_status: queued_for_workers
                                        job_id: job_a1b2c3d4
                                        ok: true
                                        source_job_id: creator-job-001
                                        source_provider: creator_pc_1
                                        status: PENDING
                                        target_executor_id: scene.composite.v1
                            schema:
                                $ref: '#/components/schemas/CreatorPushAcceptedResponse'
                    description: |
                        Payload accepted by the Master. `job_id` is the canonical
                        Velox-side identifier and can be polled via the existing
                        pipeline endpoints. `dispatch_status` is
                        `queued_for_workers` for an immediately-accepted push and
                        is preserved across idempotent replays.
                "401":
                    content:
                        application/json:
                            examples:
                                mismatch:
                                    value:
                                        error: invalid_bearer
                                        message: Bearer does not match VELOX_ADMIN_TOKEN
                                        ok: false
                                missing:
                                    value:
                                        error: missing_authorization
                                        message: Authorization header with bearer token is required
                                        ok: false
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: |
                        Missing or invalid bearer. Either the `Authorization`
                        header was absent or the bearer did not match
                        `VELOX_ADMIN_TOKEN`. The handler never echoes the actual
                        token value.
                "422":
                    content:
                        application/json:
                            examples:
                                missing_scene_duration:
                                    value:
                                        details:
                                            - issue: required
                                              path: payload.scenes.0.duration_seconds
                                        error: invalid_payload
                                        message: payload.scenes[0] missing 'duration_seconds'
                                        ok: false
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: |
                        Payload was syntactically valid JSON but semantically
                        rejected (missing required field, unknown `target_executor_id`,
                        non-`velox-asset://` voiceover pointer, etc.). **No Job
                        is created** for 422 responses — the handler fails
                        closed before delegating to `Resolver`.
                "500":
                    content:
                        application/json:
                            examples:
                                resolver_failure:
                                    value:
                                        error: resolver_failure
                                        message: 'AtomicForwardAndEnqueue failed: see server logs'
                                        ok: false
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: |
                        Resolver or storage failure inside the atomic UoW. The
                        response is best-effort: a 500 here means NO job was
                        created, but a 4xx/5xx does not rule out the job having
                        been enqueued from a concurrent push with the same
                        identity (the second leg will see the existing row).
            summary: Push a completed Creator payload directly to the Master.
            tags:
                - creator
            x-codeSamples:
                - label: Smoke push (see scripts/creator_push_smoke.sh)
                  lang: curl
                  source: |
                    curl -sS -X POST "${VELOX_MASTER_URL}/api/v1/creator/jobs" \
                      -H "Authorization: Bearer ${VELOX_ADMIN_TOKEN}" \
                      -H "X-Request-ID: creator-push-smoke" \
                      -H "Content-Type: application/json" \
                      --data-binary @examples/creator_push_basic.json
    /api/v1/jobs:
        post:
            description: |
                Simplified entry point for external systems to submit complete
                video jobs without going through the Creator intermediary.

                The payload is flat and intuitive — no nested "payload" envelope,
                no source_provider/source_job_id/target_executor_id ceremony.
                The system derives the Creator-compatible identity tuple
                automatically from the idempotency_key.

                Uses the same resolver machinery as the Creator push endpoint,
                so jobs submitted here follow the same processing pipeline.

                The idempotency_key is required and ensures that duplicate
                requests converge on the same Velox job.
            operationId: submitJob
            parameters:
                - $ref: '#/components/parameters/AuthorizationHeader'
                - $ref: '#/components/parameters/XRequestIDHeader'
            requestBody:
                content:
                    application/json:
                        examples:
                            basic_video:
                                summary: Basic video with voiceover and scenes.
                                value:
                                    delivery_plan:
                                        - destination_id: drive
                                          priority: 1
                                          retry_budget: 3
                                    idempotency_key: ext-job-20260727-001
                                    scenes:
                                        - clip_link: velox-asset://clips/opening.mp4
                                          duration_seconds: 7
                                          text: Opening scene
                                        - clip_link: velox-asset://clips/main.mp4
                                          duration_seconds: 10
                                          text: Main content
                                    script_text: This is the script for the video.
                                    video_name: My Automated Video
                                    voiceover_paths:
                                        - velox-asset://voiceovers/intro.mp3
                        schema:
                            $ref: '#/components/schemas/SubmitJobRequest'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            examples:
                                accepted:
                                    value:
                                        accepted_from: api_v1_jobs
                                        dispatch_status: queued_for_workers
                                        idempotency_key: ext-job-20260727-001
                                        job_id: job_a1b2c3d4
                                        ok: true
                                        status_url: /api/v1/jobs/job_a1b2c3d4
                            schema:
                                $ref: '#/components/schemas/SubmitJobAcceptedResponse'
                    description: |
                        Job accepted and queued for worker dispatch. The response
                        contains the Velox job_id for downstream polling.
                    headers:
                        Location:
                            description: |
                                Canonical polling URL for the just-created job. Same
                                shape as the body's `status_url` field — env-relative
                                `/api/v1/jobs/{job_id}`. RFC 7231 location-of-resource.
                            schema:
                                example: /api/v1/jobs/job_a1b2c3d4
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Invalid JSON or missing required fields.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Missing or invalid bearer token.
                "409":
                    content:
                        application/json:
                            examples:
                                hash_mismatch:
                                    value:
                                        details:
                                            - issue: hash_mismatch
                                              path: idempotency_key
                                        error: idempotency_key_reused
                                        message: idempotency_key reused with a different payload
                                        ok: false
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: |
                        Idempotency key reused with a payload that does not match
                        the previously-stored one. No new job is created. Returned
                        by the payload-hash conflict check inside
                        `creatorflow.Resolver` (which compares the existing
                        `creator_forwardings.payload_sha256` against the SHA of
                        the freshly-rebuilt worker payload).
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: |
                        Payload validation failed (e.g., no scenes, invalid
                        duration_seconds).
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Resolver or internal failure.
            summary: Submit a complete video job for external automation.
            tags:
                - jobs
    /api/v1/jobs/{job_id}:
        get:
            description: |
                Polling endpoint for jobs that came in via POST /api/v1/jobs.
                Reuses the canonical lookup surface:
                `creator_forwardings.target_job_id = :id` (backed by the
                migration-102 B-tree index, O(log N)) and falls back to
                `jobs.id = :id` for the canonical `jobs.Status` field when
                the jobs row has materialized.

                The response is intentionally minimal — 4 fields per the
                P2 spec — so a client can decide what to do next without
                parsing a wide envelope:

                  - `job_id`     echo of the URL path; canonical handle.
                  - `status`     jobs.Status (render state) — the only
                                 piece of state a polling client needs.
                  - `created`    bool source discriminator (true iff POST
                                 /api/v1/jobs produced this row). Enables a
                                 client dashboard's filter-by-intake path
                                 without a separate lookup.
                  - `status_url` self-link; clients can dereference with
                                 the same auth chain. Always
                                 `/api/v1/jobs/{job_id}` — encourages the
                                 GET response to be a stable document.

                Edge cases:
                  - Unknown `job_id` → 404 job_not_found.
                  - Pre-FORWARDED `target_job_id = NULL` → primary lookup
                    misses → 404 (callers should retry with backoff; the
                    canonical URL is preserved once the resolver commits).

                Auth: this endpoint shares the M2M bearer token surface
                with POST /api/v1/jobs (scope `jobs.submit`). Cross-client
                isolation is intentionally soft for v1 — any valid token
                can poll any job_id; strict cross-client isolation is a
                documented followup (match creator_forwardings.external_client_id
                with the m2m_client_id from the request context).
            operationId: getSubmittedJob
            parameters:
                - $ref: '#/components/parameters/AuthorizationHeader'
                - $ref: '#/components/parameters/XRequestIDHeader'
                - description: |
                    The Velox-side job identifier returned by POST /api/v1/jobs
                    (the `job_id` field of the 202 response, mirrored in the
                    `Location` header). Same shape as POST's output — the
                    hash-derived `job_<…>` format produced by
                    `enqueue.DeriveForwardingJobID`.
                  in: path
                  name: job_id
                  required: true
                  schema:
                    example: job_a1b2c3d4
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            examples:
                                creator_source:
                                    summary: Viewing a creator-source job (created=false).
                                    value:
                                        created: false
                                        job_id: job_xyz9876
                                        ok: true
                                        status: RUNNING
                                        status_url: /api/v1/jobs/job_xyz9876
                                pending_after_post:
                                    summary: Freshly-POSTed job, jobs.Status=PENDING.
                                    value:
                                        created: true
                                        job_id: job_a1b2c3d4
                                        ok: true
                                        status: PENDING
                                        status_url: /api/v1/jobs/job_a1b2c3d4
                            schema:
                                $ref: '#/components/schemas/SubmitJobStatusResponse'
                    description: |
                        Job found. The 4-field envelope contains the canonical
                        polling state at the moment of the request. Clients
                        should treat each GET as a single point-in-time query —
                        the underlying MySQL/SQLite row may have advanced since
                        the last poll.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Empty `job_id` in the URL path.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Missing or invalid M2M bearer.
                "404":
                    content:
                        application/json:
                            examples:
                                unknown:
                                    value:
                                        error: job_not_found
                                        message: job_id does not match any known creator forwarding
                                        ok: false
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: |
                        `job_id` does not match any known creator forwarding
                        row. The 404 envelope mirrors the M2M-token rejection
                        shape so a single error dispatcher handles both auth
                        + lookup misses.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Store-side failure.
            summary: Poll the status of a previously submitted job.
            tags:
                - jobs
security:
    - bearerAdminToken: []
servers:
    - url: '{scheme}://{host}'
      variables:
        host:
            default: velox.example.com
            description: Master host. Local dev defaults to http://127.0.0.1:8080.
        scheme:
            default: https
            enum:
                - http
                - https
tags:
    - description: |
        Endpoints that accept Creator-built payloads. Today the only
        entry in this group is `POST /api/v1/creator/jobs` (the sync
        push). The async `CreatorForwardingRunner` ingests the same
        shape over an out-of-band channel and falls under
        `creator_forwarder` only for metrics/observability purposes.
      name: creator
    - description: |
        Simplified job submission for external automation. Allows
        external systems to submit complete video jobs without going
        through the Creator intermediary. Uses a flat, intuitive
        payload format that maps to the same resolver machinery.
      name: jobs
