        SubmitJobStatusResponse:
            description: |
                Response shape for `GET /api/v1/jobs/{job_id}`. Mirrors the
                canonical polling contract: the 4 fields a client needs to
                (a) decide if the job is done, (b) decide which intake path
                produced it, and (c) chain the next operation via status_url.
                Reuses the canonical `creator_forwardings.target_job_id`
                lookup backed by the migration-102 B-tree index.
            properties:
                created:
                    description: |
                        Source discriminator. `true` iff the row was produced by
                        POST /api/v1/jobs (source_provider == 'external_api');
                        `false` iff it came in via POST /api/v1/creator/jobs.
                        Clients can use this boolean to filter their polling
                        surface (e.g. a M2M dashboard cares only about its own
                        external jobs and can drop creator-source rows).
                    example: true
                    type: boolean
                job_id:
                    description: Echoed from the URL path.
                    example: job_a1b2c3d4
                    type: string
                ok:
                    description: Always `true` on a successful 200.
                    enum:
                        - true
                    example: true
                    type: boolean
                status:
                    description: |
                        jobs.Status (canonical render state) when the jobs row
                        has materialized; falls back to
                        creator_forwardings.status during the brief pre-FORWARDED
                        race window. The enum below is the public-facing
                        jobs.Status vocabulary.
                    enum:
                        - PENDING
                        - READY
                        - LEASED
                        - RUNNING
                        - SUCCEEDED
                        - FAILED
                        - CANCELLED
                        - AWAITING_ARTIFACT
                        - RETRY_WAIT
                    example: PENDING
                    type: string
                status_url:
                    description: |
                        Self-link. Always returns
                        `"/api/v1/jobs/" + <this job_id>` so clients can
                        copy-paste the URL into their next request without
                        re-deriving from the path the response came in on.
                    example: /api/v1/jobs/job_a1b2c3d4
                    type: string
            required:
                - ok
                - job_id
                - status
                - created
                - status_url
            type: object
