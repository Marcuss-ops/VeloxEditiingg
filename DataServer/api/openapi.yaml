                    maximum: 86400
                    minimum: 0.1
                    type: number
                index:
                    minimum: 0
                    type: integer
                kind:
                    maxLength: 32
                    type: string
                scene_id:
                    maxLength: 64
                    type: string
                stock:
                    $ref: '#/components/schemas/SubmitClip'
                stock_fallback:
                    type: boolean
                stock_links:
                    items:
                        type: string
                    minItems: 0
                    type: array
                subtitles:
                    $ref: '#/components/schemas/SubmitSubtitles'
                text:
                    minLength: 1
                    type: string
                voiceover:
                    $ref: '#/components/schemas/SubmitVoiceover'
            required:
                - duration_seconds
                - text
            type: object
        SubmitSubtitles:
            properties:
                asset_id:
                    maxLength: 128
                    type: string
                format:
                    enum:
                        - ass
                        - srt
                        - vtt
                    type: string
                language:
                    maxLength: 2
                    minLength: 2
                    type: string
                sha256:
                    maxLength: 64
                    minLength: 64
                    pattern: ^[0-9a-f]{64}$
                    type: string
                url:
                    format: uri
                    maxLength: 2048
                    type: string
            type: object
        SubmitVisualReplacement:
            properties:
                asset:
                    $ref: '#/components/schemas/SubmitClip'
                profile_id:
                    maxLength: 128
                    minLength: 1
                    type: string
                replacement_id:
                    maxLength: 128
                    minLength: 1
                    type: string
                timeline_end_us:
                    minimum: 1
                    type: integer
                timeline_start_us:
                    minimum: 0
                    type: integer
            required:
                - asset
                - profile_id
                - replacement_id
            type: object
        SubmitVoiceover:
            properties:
                asset_id:
                    maxLength: 128
                    type: string
                drive_file_id:
                    maxLength: 128
                    type: string
                duration_ms:
                    minimum: 0
                    type: integer
                language:
                    maxLength: 2
                    minLength: 2
                    type: string
                sha256:
                    maxLength: 64
                    minLength: 64
                    pattern: ^[0-9a-f]{64}$
                    type: string
                url:
                    format: uri
                    maxLength: 2048
                    type: string
            type: object
    securitySchemes:
        bearerAdminToken:
            bearerFormat: opaque
            description: |
                Bearer token matching `cfg.Auth.AdminToken`, which is loaded
                from the `VELOX_ADMIN_TOKEN` env var on the Master process
                (see `DataServer/internal/config/config_misc.go::loadAuth`).
                The token is opaque to clients; rotate via `scripts/rotate_token.sh`
                + restart. Minimum length is enforced server-side. A missing
                or mismatched bearer returns `401 Unauthorized`; never echo
                the token value in client logs.
            scheme: bearer
            type: http
        bearerM2MToken:
            bearerFormat: opaque
            description: |
                M2M bearer issued by the Velox administrator. Job routes
                require the `jobs.submit` scope and are validated by the
                M2M key middleware.
            scheme: bearer
            type: http
info:
    contact:
        name: Velox architecture
        url: https://github.com/example/velox
    description: |
        The Velox Master exposes a small, authenticated HTTP API for
        programmatic intake of creator-built payloads and for orchestrator
        control. API endpoints are protected by bearer authorization. Most
        legacy routes use the configured `VELOX_ADMIN_TOKEN`; M2M publishing
        and job-submission routes use the scoped credential middleware and
        require the `jobs.submit` scope.

        This revision focuses on the new **creator_push** intake path
        (`POST /api/v1/creator/jobs`) introduced alongside the existing
        async `CreatorForwardingRunner` poller. Both intake paths converge
        on the canonical `creatorflow.Resolver` (the unique writer of
        `creator_forwardings`/`jobs`/`tasks`); the push handler does NOT
        open its own transaction or duplicate schema. See
        `docs/architecture/current-architecture.md` §12 and §4.2 of
        `docs/architecture/runtime-invariants.md` for the invariant.

        The HTTP contract is also documented narratively in
        `docs/CREATOR-PUSH.md`. Whenever the two disagree, the tested
        behavior in `DataServer/internal/handlers/server/pipeline/creator_push_e2e_test.go`
        is the source of truth.

        NOTE ON SCHEMA REDUNDANCY: this spec declares BOTH `CreatorPushPayload`
        (the flat wire-facing schema the Creator machine sends) and
        `RemotePipelineResult` (the nested typed DTO that the handler
        reconstructs via `remoteengine.ParseRemotePipelineResult`, with the
        flat→nested mapping rules documented under the `x-flat-to-dto`
        extension on the latter). The wire format is `CreatorPushPayload`;
        `RemotePipelineResult` is documented for completeness + parser
        cross-checking.
    license:
        name: Proprietary
    summary: Contract for Velox Master endpoints, with focus on the creator_push intake.
    title: Velox Master HTTP API
    version: 0.6.0-creatorpush-v3
openapi: 3.1.0
paths:
    /api/v1/creator/jobs:
        post:
            operationId: pushCreatorJob
            parameters:
                - $ref: '#/components/parameters/AuthorizationHeader'
                - $ref: '#/components/parameters/XRequestIDHeader'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreatorPushRequest'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreatorPushAcceptedResponse'
                    description: Accepted.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized.
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unprocessable Entity.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error.
            security:
                - bearerAdminToken: []
            summary: Push a completed Creator payload directly to the Master.
            tags:
                - creator
    /api/v1/jobs:
        post:
            operationId: submitJob
            parameters:
                - $ref: '#/components/parameters/AuthorizationHeader'
                - $ref: '#/components/parameters/XRequestIDHeader'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubmitJobRequest'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SubmitJobAcceptedResponse'
                    description: Accepted.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized.
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Conflict.
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unprocessable Entity.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error.
            security:
                - bearerM2MToken: []
            summary: Submit a complete video job for external automation.
            tags:
                - jobs
    /api/v1/jobs/{job_id}:
        get:
            operationId: getSubmittedJob
            parameters:
                - $ref: '#/components/parameters/AuthorizationHeader'
                - $ref: '#/components/parameters/XRequestIDHeader'
                - $ref: '#/components/parameters/PathJobID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SubmitJobStatusResponse'
                    description: OK.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Not Found.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error.
            security:
                - bearerM2MToken: []
            summary: Poll the status of a previously submitted job.
            tags:
                - jobs
    /api/v1/jobs/batch:
        post:
            operationId: submitJobBatch
            parameters:
                - $ref: '#/components/parameters/AuthorizationHeader'
                - $ref: '#/components/parameters/XRequestIDHeader'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubmitJobBatchRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SubmitJobBatchResponse'
                    description: OK.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Bad Request.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized.
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unprocessable Entity.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Internal Server Error.
            security:
                - bearerM2MToken: []
            summary: Submit multiple independent video jobs in one request.
            tags:
                - jobs
    /api/v1/publishing/catalog:
        post:
            operationId: listPublishingCatalog
            parameters:
                - $ref: '#/components/parameters/AuthorizationHeader'
                - $ref: '#/components/parameters/XRequestIDHeader'
            responses:
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized.
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Gone.
            security:
                - bearerM2MToken: []
            summary: 'Retired: Velox does not expose the InstaEdit-owned channel/group catalog.'
            tags:
                - publishing
    /api/v1/publishing/targets:
        post:
            operationId: listPublishingTargets
            parameters:
                - $ref: '#/components/parameters/AuthorizationHeader'
                - $ref: '#/components/parameters/XRequestIDHeader'
            responses:
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Unauthorized.
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorEnvelope'
                    description: Gone.
            security:
                - bearerM2MToken: []
            summary: 'Retired: Velox does not expose the InstaEdit-owned channel catalog.'
            tags:
                - publishing
security:
    - bearerAdminToken: []
servers:
    - url: '{scheme}://{host}'
      variables:
        host:
            default: velox.example.com
            description: Master host. Local dev defaults to http://127.0.0.1:8080.
        scheme:
            default: https
            enum:
                - http
                - https
tags:
    - description: |
        Endpoints that accept Creator-built payloads. Today the only
        entry in this group is `POST /api/v1/creator/jobs` (the sync
        push). The async `CreatorForwardingRunner` ingests the same
        shape over an out-of-band channel and falls under
        `creator_forwarder` only for metrics/observability purposes.
      name: creator
    - description: |
        Simplified job submission for external automation. Allows
        external systems to submit complete video jobs without going
        through the Creator intermediary. Uses a flat, intuitive
        payload format that maps to the same resolver machinery.
      name: jobs
