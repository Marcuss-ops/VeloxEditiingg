---
# LEGACY MIGRATION GUARD — production worker updates are Master-owned.
#
# This playbook intentionally performs no bundle download, source transfer,
# Docker build, or service restart. Use fleetctl update with a pinned digest
# so FleetController records, verifies, activates and observes the rollout.

- name: Reject legacy worker update path
  hosts: velox_workers
  gather_facts: false
  tasks:
    - name: Update | Require FleetController API path
      ansible.builtin.fail:
        msg: >-
          update_workers.yml is retired for production. Run fleetctl update
          <worker_id> --digest sha256:<64-hex> through the Master instead.
