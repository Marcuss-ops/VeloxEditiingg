---
# ============================================================
# INSTALL WORKERS — Reinstallazione completa worker
# ============================================================
# Azioni:
#   - Preflight checks (OS, comandi, disco)
#   - Setup directory worker
#   - Docker build immagine worker
#   - Config systemd + watchdog + auto-update
#   - Avvio servizio
#
# Incluse: tasks/prepare_worker_image.yml + tasks/canonical_worker_runtime.yml
# (single source of truth per PR-1 split)
# ============================================================

- name: Install workers
  hosts: velox_workers
  gather_facts: true
  become: true
  vars:
    velox_dir: "/opt/velox"
    master_url: "{{ master_url | default('http://127.0.0.1:8000') }}"

  tasks:
    # ── PREREQUISITI ─────────────────────────────────────────
    - name: Install | Test connesione SSH
      ansible.builtin.ping:

    - name: Install | Verifica OS supportato
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: "OS {{ ansible_os_family }} non supportato — richiesto Debian/Ubuntu"

    - name: Install | Verifica architettura dell’immagine canonica
      ansible.builtin.assert:
        that:
          # The pinned Debian base and published worker image are linux/amd64.
          # Do not claim aarch64 support until a separately pinned multi-arch
          # base/image manifest is published and verified.
          - ansible_architecture == "x86_64"
        fail_msg: >-
          Architettura {{ ansible_architecture }} non supportata dalla worker
          image canonica linux/amd64. Pubblicare prima un manifest multi-arch
          con digest/base pin distinti per riabilitare aarch64.

    - name: Install | Verifica comandi essenziali
      ansible.builtin.command: "which {{ item }}"
      register: required_cmds
      changed_when: false
      failed_when: false
      loop:
        - python3
        - curl
        - docker
        - systemctl

    - name: Install | Fail se comandi essenziali mancanti
      ansible.builtin.fail:
        msg: "Comando mancante: {{ item.item }}"
      loop: "{{ required_cmds.results }}"
      when: item.rc != 0

    # ── DIRECTORY WORKER ─────────────────────────────────────
    - name: Install | Crea directory worker
      ansible.builtin.file:
        path: "{{ velox_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - cache
        - bin

    - name: Install | Crea directory per override systemd
      ansible.builtin.file:
        path: "/etc/systemd/system/velox-worker-{{ inventory_hostname }}.service.d"
        state: directory
        mode: "0755"

    # Go and C++ binaries are built inside the canonical multistage Dockerfile.
    # The controller never injects a host-built executable into the image.

    # ── SYNC CODE FROM CONTROLLER ─────────────────────────────
    - name: Install | Ensure code directory exists and is writable
      ansible.builtin.file:
        path: "{{ velox_dir }}/current"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Install | Synchronize worker code from controller to host
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../../../"
        dest: "{{ velox_dir }}/current/"
        delete: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=secrets"
          - "--exclude=.velox"
          - "--exclude=bin/velox-server"
          - "--exclude=*.md"
          - "--exclude=DataServer"
      delegate_to: localhost
      become: false

    # ── UNIFIED DEPLOY (shared task) ─────────────────────────
    # deploy_worker_release copies current → current.new, validates,
    # swaps atomically, builds Docker, configures systemd, and verifies.
    - name: "Install | Deploy worker release (no bundle: code is in current/)"
      ansible.builtin.include_tasks:
        file: tasks/deploy_worker_release.yml
      vars:
        bundle_zip_path: ""

    - name: Install | Riepilogo installazione
      ansible.builtin.debug:
        msg: |-
          ✅ Installazione completata per {{ inventory_hostname }}

          Servizio: velox-worker-{{ inventory_hostname }}
          Docker: {{ _worker_image_tag | default('velox-worker:latest') }}
          Directory: {{ velox_dir }}
          Master: {{ master_url }}
