---
# ============================================================
# NORMALIZE WORKER SYSTEMD — One-time legacy cutover and verification
# ============================================================
# This playbook is a migration tool, not the steady-state deploy path.
# It retires legacy per-host units once, then delegates all future runtime
# convergence to the canonical worker layout:
#   velox-worker.service -> Compose project velox-worker -> container velox-worker
#   /etc/velox-worker/worker.env + /var/lib/velox-worker
# ============================================================

- name: Normalize worker systemd
  hosts: velox_workers
  gather_facts: true
  vars:
    velox_dir: "/opt/velox"
    master_url: "{{ master_url | default('http://127.0.0.1:8000') }}"
    velox_worker_migration_marker: "/var/lib/velox-worker/migration/completed"

  tasks:
    - name: Normalize | Check one-time migration marker
      ansible.builtin.stat:
        path: "{{ velox_worker_migration_marker }}"
      register: velox_worker_migration_done

    # ── STEP 1/2: One-time legacy cutover ─────────────────────
    # Legacy discovery, state migration, unit retirement, and container
    # cleanup are owned by canonical_worker_runtime.yml via the migration
    # helper. Keeping a second cleanup implementation here would make the
    # migration order-dependent and would reintroduce two runtime owners.

    # ── STEP 3: Unified deploy pipeline (single source of truth) ──
    # deploy_worker_release → stop → staging → validate → swap → Docker build → verify → rollback
    - name: Normalize | Deploy and rebuild worker
      ansible.builtin.include_tasks:
        file: tasks/deploy_worker_release.yml
      vars:
        bundle_zip_path: ""

    - name: Normalize | Get journal logs
      ansible.builtin.shell: |
        journalctl -u velox-worker.service --no-pager -n 30 2>/dev/null || true
      args:
        executable: /bin/bash
      register: journal_output
      changed_when: false
      failed_when: false

    - name: Normalize | Show recent journal
      ansible.builtin.debug:
        msg: "{{ journal_output.stdout_lines | default([]) }}"

    # ── STEP 7: Assert Idempotency & Purity ───────────────────
    # Hard-fail if the post-normalization state is not canonical-only.
    #
    # Operationally this is a *stricter idempotency gate*: every run
    # must terminate with the host holding exactly one canonical
    # `velox-worker.service` plus the two named
    # siblings (watchdog, auto-update). Any other surviving unit, OR
    # the absence of the canonical unit itself, fails the play.
    #
    # Notes:
    #   * The `shell` task runs the real `systemctl list-unit-files`
    #     even under `--check` mode: we assert *actual* on-host
    #     state (post-deploy), not would-be state. No `|| true` —
    #     a broken systemctl will surface loudly.
    #   * The no-stragglers assert runs as a loop over the live
    #     enumeration; an empty list trivially passes the loop, so a
    #     separate canonical-present assert below closes that gap.
    - name: Normalize | Reload systemd daemon (refresh unit-file cache)
      ansible.builtin.shell: |
        set -euo pipefail
        systemctl daemon-reload 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false


    - name: Normalize | Enumerate surviving velox-worker units
      ansible.builtin.shell: |
        set -euo pipefail
        systemctl list-unit-files 'velox-worker*.service' --no-legend --no-pager 2>/dev/null \
          | awk '{print $1}'
      args:
        executable: /bin/bash
      register: check_remaining_units
      changed_when: false

    - name: Normalize | Assert canonical unit present (no-empty-state guard)
      ansible.builtin.assert:
        that:
          - check_remaining_units.stdout_lines | length > 0
          - "'velox-worker.service' in check_remaining_units.stdout_lines"
        fail_msg: |-
          Idempotency fail: canonical unit `velox-worker.service`
          is missing from `systemctl list-unit-files`. Surviving: {{ check_remaining_units.stdout_lines | default([]) }}.
        success_msg: "OK canonical present: velox-worker.service"

    - name: Normalize | Assert no non-canonical stragglers
      ansible.builtin.assert:
        that:
          - >-
            item in [
              'velox-worker.service',
              'velox-worker-watchdog.service',
              'velox-auto-update.service'
            ]
        fail_msg: |-
          Idempotency fail: non-canonical unit survived normalization -> {{ item }}.
          Surviving full list: {{ check_remaining_units.stdout_lines | default([]) }}.
      loop: "{{ check_remaining_units.stdout_lines | default([]) }}"

    - name: Normalize | Summarize canonical purity result
      ansible.builtin.debug:
        msg: "Canonical purity OK: {{ check_remaining_units.stdout_lines | length }} surviving units, all whitelisted."


    # ── STEP 8: Riepilogo finale ──────────────────────────────
    - name: Normalize | Final summary
      ansible.builtin.debug:
        msg: |-
          ========================================
          NORMALIZE COMPLETE — {{ inventory_hostname }}
          ========================================
          Worker ID: {{ worker_id | default(inventory_hostname) }}
          Service:   velox-worker.service
          Env file:  /etc/velox-worker/worker.env
          Master:    {{ master_url }}
          ========================================
