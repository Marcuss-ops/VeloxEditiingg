---
# ============================================================
# CANONICAL WORKER RUNTIME
# ============================================================
# One host -> one systemd unit -> one Compose project -> one Docker container
# -> one writable runtime tree. Code remains read-only under /app; mutable
# state lives under /var/lib/velox-worker on the host.
# ============================================================

- name: CanonicalRuntime | Resolve release root
  ansible.builtin.set_fact:
    velox_current_root: "{{ velox_dir }}/current"

- name: CanonicalRuntime | Require explicit VELOX_STATE_DIR
  ansible.builtin.assert:
    that:
      - velox_state_dir is defined
      - velox_state_dir | string | length > 0
      - velox_state_dir is match('^/')
      - not (velox_state_dir is search('/\.\.?(/|$)'))
    fail_msg: >-
      velox_state_dir (the canonical VELOX_STATE_DIR) must be explicitly
      configured as an absolute path without traversal; no default is allowed.

- name: CanonicalRuntime | Resolve canonical identity and paths
  ansible.builtin.set_fact:
    velox_worker_identity: "{{ worker_id | default(inventory_hostname) }}"
    velox_worker_unit_name: "velox-worker.service"
    velox_worker_container_name: "velox-worker"
    velox_worker_env_path: "/etc/velox-worker/worker.env"
    velox_worker_runtime_host_dir: "{{ velox_state_dir }}"
    velox_worker_runtime_container_dir: "{{ velox_state_dir }}"
    velox_worker_compose_dir: "/opt/velox-worker"
    velox_worker_project_name: "velox-worker"
    velox_worker_service_source: "{{ velox_current_root }}/deploy/runtime/velox-worker.service"
    velox_worker_compose_source: "{{ velox_current_root }}/deploy/runtime/compose.yml"
    velox_worker_migration_source: "{{ velox_current_root }}/deploy/runtime/migrate-legacy-worker.sh"
    velox_worker_migration_marker: "{{ velox_state_dir }}/migration/completed"
    velox_worker_health_port: 8081
    velox_worker_heartbeat_masters: "{{ master_url }}"
    velox_worker_secondary_master_url: ""
    # gRPC control endpoint is the explicit velox_grpc_control_endpoint from
    # group_vars. The fallback (legacy bridge playbooks that do not load
    # group_vars) derives the host from master_url but NEVER keeps the REST
    # port: the port comes from the typed velox_grpc_port variable so a wrong
    # silent endpoint (REST :8000 as gRPC) cannot be produced.
    velox_worker_control_grpc_url: >-
      {{
        velox_grpc_control_endpoint
        | default(
            (master_url | regex_replace('^https?://', '') | regex_replace('/.*$', '') | regex_replace(':[0-9]+$', ''))
            ~ ':'
            ~ (velox_grpc_port | default('9000'))
          )
      }}

# Fail closed before migration, env rendering, or directory creation. The
# canonical velox-worker.service.d directory is allowed. Legacy per-worker
# drop-in directories are removed only when completely empty; any file,
# symlink, or nested entry aborts convergence so an operator can inspect it.
- name: CanonicalRuntime | Remove empty legacy worker drop-in directories
  ansible.builtin.shell: |
    set -euo pipefail
    roots=(
      /etc/systemd/system
      /run/systemd/system
      /lib/systemd/system
      /usr/lib/systemd/system
    )
    legacy_dirs=()
    for root in "${roots[@]}"; do
      [ -d "$root" ] && [ -r "$root" ] || {
        echo "legacy worker drop-in root is missing or unreadable: $root" >&2
        exit 1
      }
      found="$(find "$root" -type d -name 'velox-worker-*.service.d' -print)" || {
        echo "cannot scan legacy worker drop-in root: $root" >&2
        exit 1
      }
      while IFS= read -r dir; do
        [ -n "$dir" ] && legacy_dirs+=("$dir")
      done <<< "$found"
    done

    # Preflight every candidate first. No directory is removed if any
    # candidate contains a file, symlink, or nested entry.
    for dir in "${legacy_dirs[@]}"; do
      [ -n "$dir" ] || continue
      entry="$(find "$dir" -mindepth 1 -maxdepth 1 -print -quit)" || {
        echo "cannot inspect legacy worker drop-in directory: $dir" >&2
        exit 1
      }
      if [ -n "$entry" ]; then
        echo "legacy worker drop-in directory is not empty: $dir" >&2
        exit 1
      fi
    done

    for dir in "${legacy_dirs[@]}"; do
      [ -n "$dir" ] || continue
      rmdir "$dir"
      echo "REMOVED_EMPTY:$dir"
    done
  args:
    executable: /bin/bash
  changed_when: "'REMOVED_EMPTY:' in (stdout | default(''))"

- name: CanonicalRuntime | Ensure canonical Compose directory exists
  ansible.builtin.file:
    path: "{{ velox_worker_compose_dir }}"
    state: directory
    mode: "0755"

- name: CanonicalRuntime | Check one-time legacy migration marker
  ansible.builtin.stat:
    path: "{{ velox_worker_migration_marker }}"
  register: velox_worker_migration_done

# Legacy state discovery and copying belong only to the migration boundary.
# Empty legacy systemd drop-in directories are retired above; non-empty ones
# fail closed before steady-state convergence can mutate the host.
- name: CanonicalRuntime | Install one-time legacy migration helper
  ansible.builtin.copy:
    src: "{{ velox_worker_migration_source }}"
    dest: "{{ velox_worker_compose_dir }}/migrate-legacy-worker.sh"
    remote_src: true
    mode: "0755"
  when: not velox_worker_migration_done.stat.exists

- name: CanonicalRuntime | Migrate legacy runtime once before convergence
  ansible.builtin.command:
    argv:
      - "{{ velox_worker_compose_dir }}/migrate-legacy-worker.sh"
  environment:
    WORKER_ID: "{{ velox_worker_identity }}"
    LEGACY_RUNTIME_DIR: ""
    VELOX_STATE_DIR: "{{ velox_state_dir }}"
  when: not velox_worker_migration_done.stat.exists

- name: CanonicalRuntime | Read release bundle hash
  ansible.builtin.slurp:
    src: "{{ velox_current_root }}/RemoteCodex/BUNDLE_HASH.txt"
  register: velox_worker_bundle_hash_file

# BUNDLE_HASH is a single 64-hex SHA256 token. A newline in the source file
# (historically: `BUNDLE_HASH.txt` with a trailing or embedded `\n`) made the
# rendered worker_config.json unparseable (`invalid character '\n'`). Strip
# ALL whitespace — not just trim edges — so a stray newline can never leak
# into JSON, then assert the canonical 64-hex shape before any consumer
# touches the value.
- name: CanonicalRuntime | Sanitize release bundle hash (strip all whitespace)
  ansible.builtin.set_fact:
    velox_worker_bundle_hash: >-
      {{
        (bundle_hash | default(velox_worker_bundle_hash_file.content | b64decode, true))
        | regex_replace('\s', '')
      }}

- name: CanonicalRuntime | Assert bundle hash is a 64-hex SHA256
  ansible.builtin.assert:
    that:
      - velox_worker_bundle_hash | length == 64
      - velox_worker_bundle_hash is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      {{ velox_current_root }}/RemoteCodex/BUNDLE_HASH.txt does not contain a
      canonical 64-hex SHA256. Resolved value: '{{ velox_worker_bundle_hash }}'
      ({{ velox_worker_bundle_hash | length }} chars). Fix the bundle source;
      do not disable this gate.

# Legacy state discovery and copying remain owned by the migration helper.
# Empty legacy systemd drop-in directories are retired by the atomic cleanup
# above; non-empty ones fail closed before steady-state convergence.

- name: CanonicalRuntime | Create missing writable runtime directories without rewriting metadata
  ansible.builtin.shell: |
    set -euo pipefail
    ensure_missing() {
      local path="$1"
      if [ -e "$path" ]; then
        [ -d "$path" ] || { echo "$path exists but is not a directory" >&2; return 1; }
        return 0
      fi
      mkdir -p "$path"
      chown 10001:10001 "$path"
      chmod 0775 "$path"
      echo "CREATED:$path"
    }
    ensure_missing "{{ item }}"
  args:
    executable: /bin/bash
  loop:
    - "{{ velox_worker_runtime_host_dir }}"
    - "{{ velox_worker_runtime_host_dir }}/work"
    - "{{ velox_worker_runtime_host_dir }}/cache"
    - "{{ velox_worker_runtime_host_dir }}/blobs"
    - "{{ velox_worker_runtime_host_dir }}/assets_cache"
  register: canonical_runtime_dir_result
  changed_when: "'CREATED:' in (stdout | default(''))"

- name: CanonicalRuntime | Preserve existing worker credential across env rewrite
  ansible.builtin.shell: |
    set -o pipefail
    target="{{ velox_worker_env_path }}"
    # The canonical env is the steady-state source. During the one-time
    # migration only, the helper has already copied any legacy credential into
    # this path; never scan legacy env files during normal convergence.
    if [ -f "$target" ]; then
      grep -m1 -E '^VELOX_WORKER_SECRET=[^[:space:]]' "$target" || true
    fi
    if [ -s /etc/velox-worker/secrets/worker_credential ]; then
      printf 'VELOX_WORKER_CREDENTIAL_FILE=/run/velox/secrets/worker_credential\n'
    fi
    exit 0
  args:
    executable: /bin/bash
  register: _existing_worker_secret
  changed_when: false
  failed_when: false
  no_log: true

- name: CanonicalRuntime | Resolve canonical worker credential line (vault wins over preserved)
  ansible.builtin.set_fact:
    _worker_secret_line: >-
      {{
        ('VELOX_WORKER_SECRET=' ~ worker_secret)
        if (worker_secret | default('') | length > 0)
        else (_existing_worker_secret.stdout | default(''))
      }}
  no_log: true

- name: CanonicalRuntime | Write per-host env file (consumed by systemd unit EnvironmentFile)
  ansible.builtin.copy:
    dest: "{{ velox_worker_env_path }}"
    mode: "0600"
    content: |
      MASTER_URL={{ master_url }}
      VELOX_HEARTBEAT_MASTERS={{ velox_worker_heartbeat_masters }}
      VELOX_SECONDARY_MASTER_URL={{ velox_worker_secondary_master_url }}
      WORKER_NAME={{ inventory_hostname }}
      VELOX_WORKER_ID={{ worker_id | default(inventory_hostname) }}
      VELOX_DIR={{ velox_dir }}
      VELOX_BUNDLE_VERSION={{ version_number | default('v1.0.6') }}
      VELOX_VERSION_NUMBER={{ version_number | default('v1.0.6') }}
      VELOX_BUNDLE_HASH={{ velox_worker_bundle_hash }}
      VELOX_WORKER_PROTOCOL_VERSION={{ worker_protocol_version | default('v3') }}
      VELOX_ENGINE_VERSION={{ engine_version | default(version_number | default('v1.0.6')) }}
      VELOX_HEALTH_PORT={{ velox_worker_health_port }}
      VELOX_MASTER_URL={{ master_url }}
      VELOX_WORK_DIR={{ velox_worker_runtime_container_dir }}/work
      VELOX_WORKER_IMAGE={{ _worker_image_tag }}
      VELOX_WORKER_IMAGE_VERSION={{ _worker_image_version }}
      VELOX_WORKER_IMAGE_COMMIT={{ _worker_image_commit }}
      # Canonical runtime state is always the fixed host/container path.
      VELOX_GRPC_MASTER_URL={{ velox_worker_control_grpc_url }}
      VELOX_STATE_DIR={{ velox_worker_runtime_container_dir }}
      {% if _worker_secret_line | length > 0 %}
      {{ _worker_secret_line }}
      {% endif %}
  no_log: true

- name: CanonicalRuntime | Check canonical env or credential file carries a non-empty worker secret
  ansible.builtin.shell: |
    set -o pipefail
    grep -E '^VELOX_WORKER_SECRET=[^[:space:]]' "{{ velox_worker_env_path }}" >/dev/null 2>&1 \
      || test -s /etc/velox-worker/secrets/worker_credential
  args:
    executable: /bin/bash
  register: _env_has_secret
  changed_when: false
  failed_when: false
  no_log: true

# ── PRE-RESTART CREDENTIAL GATE ───────────────────────────────
# A worker that already holds a stored credential on the master MUST be
# restarted with that secret present, or it re-enters the `credential
# required (existing credential stored)` loop (observed on host_57_129 on
# 2026-08-04). This gate runs BEFORE the canonical unit is (re)started:
# the env file was just (re)written above, and the master's registration
# list is probed to classify the worker.
- name: CanonicalRuntime | Query master registration list (pre-restart credential gate)
  ansible.builtin.uri:
    url: "{{ master_verify_url | default(master_url) }}/api/v1/workers"
    method: GET
    return_content: true
    status_code: 200
    timeout: 10
  register: _master_workers_gate
  delegate_to: localhost
  become: false
  retries: 12
  delay: 5
  until: _master_workers_gate.status == 200
  ignore_errors: true

- name: CanonicalRuntime | Compute master-side registration state for this worker
  ansible.builtin.set_fact:
    _worker_registered_on_master: >-
      {{
        (_master_workers_gate.status | default(0) == 200) and
        ((_master_workers_gate.json | default({})).workers | default([])
          | selectattr('worker_id', 'equalto', velox_worker_identity)
          | list
          | length) > 0
      }}

- name: CanonicalRuntime | Fail before restart when a registered worker lacks its secret
  ansible.builtin.fail:
    msg: >-
      Worker {{ velox_worker_identity }} is registered on the master
      (stored credential) but neither {{ velox_worker_env_path }} carries a
      non-empty VELOX_WORKER_SECRET nor the canonical worker credential file
      exists. The worker would restart straight into `credential required
      (existing credential stored)` and never register. Provide the secret via
      per-host `worker_secret` (vault-backed) or the credential file, then
      re-run. Aborting BEFORE restarting the canonical unit.
  when:
    - _worker_registered_on_master | bool
    - (_env_has_secret.rc | default(1)) != 0

- name: CanonicalRuntime | Fail before restart when an unregistered worker has no secret
  ansible.builtin.fail:
    msg: >-
      Worker {{ velox_worker_identity }} is NOT yet registered on the master
      and neither {{ velox_worker_env_path }} carries a non-empty
      VELOX_WORKER_SECRET nor the canonical credential file exists. On a
      credential-enforcing master a worker with no secret cannot register at
      all (`credential required`). Provide the secret via per-host
      `worker_secret` (vault-backed) or the credential file, then re-run.
      Aborting BEFORE restarting the canonical unit.
  when:
    - not (_worker_registered_on_master | bool)
    - (_env_has_secret.rc | default(1)) != 0
    - _master_workers_gate.status | default(0) == 200

- name: CanonicalRuntime | Fail when secret is missing and master cannot be reached
  ansible.builtin.fail:
    msg: >-
      neither {{ velox_worker_env_path }} carries a non-empty
      VELOX_WORKER_SECRET nor the canonical credential file exists, and the
      master registration list is unreachable
      (status={{ _master_workers_gate.status | default('error') }}). Cannot
      certify this worker is safe to restart. Provide the secret via per-host
      `worker_secret` (vault-backed), then re-run.
  when:
    - (_env_has_secret.rc | default(1)) != 0
    - _master_workers_gate.status | default(0) != 200

- name: CanonicalRuntime | Inspect existing worker config metadata
  ansible.builtin.stat:
    path: "{{ velox_worker_runtime_host_dir }}/worker_config.json"
  register: _worker_config_stat

- name: CanonicalRuntime | Write canonical worker config outside checkout
  ansible.builtin.copy:
    dest: "{{ velox_worker_runtime_host_dir }}/worker_config.json"
    owner: "{{ '10001' if not _worker_config_stat.stat.exists else omit }}"
    group: "{{ '10001' if not _worker_config_stat.stat.exists else omit }}"
    mode: "{{ '0640' if not _worker_config_stat.stat.exists else 'preserve' }}"
    content: |
      {
        "master_url": "{{ master_url }}",
        "worker_id": "{{ velox_worker_identity }}",
        "worker_name": "{{ inventory_hostname }}",
        "work_dir": "{{ velox_worker_runtime_container_dir }}/work",
        "log_level": "info",
        "bundle_version": "{{ version_number | default('v1.0.6') }}",
        "bundle_hash": "{{ velox_worker_bundle_hash }}",
        "protocol_version": "{{ worker_protocol_version | default('v3') }}",
        "engine_version": "{{ engine_version | default(version_number | default('v1.0.6')) }}",
        "environment": "staging",
        "max_active_jobs": 1,
        "prometheus_port": {{ velox_worker_prometheus_port | default(9090) }},
        "health_port": {{ velox_worker_health_port }},
        "control_grpc_url": "{{ velox_worker_control_grpc_url }}",
        "tls_cert_file": "/run/velox/certs/worker.crt",
        "tls_key_file": "/run/velox/certs/worker.key",
        "tls_ca_file": "/run/velox/certs/ca.crt",
        "video_engine_cpp_bin": "/usr/local/bin/velox_video_engine"
      }

# The config above is templated — a stray newline in BUNDLE_HASH (or any
# template break) would render invalid JSON that the worker chokes on at
# boot. Validate the rendered file with jq and fail before any restart.
- name: CanonicalRuntime | Validate worker_config.json with jq
  ansible.builtin.shell: |
    set -euo pipefail
    CFG="{{ velox_worker_runtime_host_dir }}/worker_config.json"
    command -v jq >/dev/null 2>&1 || { echo "jq is required on worker hosts but is not installed"; exit 2; }
    jq empty "$CFG" && echo "JSON_OK"
  args:
    executable: /bin/bash
  register: _worker_config_jq
  changed_when: false
  failed_when: _worker_config_jq.rc != 0

# ── INSTALL CANONICAL COMPOSE RUNTIME ─────────────────────────
- name: CanonicalRuntime | Install canonical Compose definition
  ansible.builtin.copy:
    src: "{{ velox_worker_compose_source }}"
    dest: "{{ velox_worker_compose_dir }}/compose.yml"
    remote_src: true
    mode: "0644"

- name: CanonicalRuntime | Install canonical systemd definition
  ansible.builtin.copy:
    src: "{{ velox_worker_service_source }}"
    dest: "/etc/systemd/system/{{ velox_worker_unit_name }}"
    remote_src: true
    mode: "0644"

- name: CanonicalRuntime | Install canonical watchdog service
  ansible.builtin.copy:
    dest: /etc/systemd/system/velox-worker-watchdog.service
    mode: "0644"
    content: |
      [Unit]
      Description=Velox Worker Watchdog (canonical unit only)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      # CANONICAL-ONLY: never use `velox-worker*.service` here. The watchdog
      # is a one-job unit: probe the exact canonical unit and re-arm it if
      # it's down. A wildcard would re-introduce the very failure mode
      # the hostile-cleanup block above is designed to prevent.
      ExecStart=/bin/sh -c 'systemctl is-active --quiet {{ velox_worker_unit_name }} || systemctl restart {{ velox_worker_unit_name }}'
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=velox-worker-watchdog

- name: CanonicalRuntime | Install canonical watchdog timer (5m)
  ansible.builtin.copy:
    dest: /etc/systemd/system/velox-worker-watchdog.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Velox Worker Watchdog Timer (canonical)

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=5min
      AccuracySec=30s
      Unit=velox-worker-watchdog.service

      [Install]
      WantedBy=timers.target

- name: CanonicalRuntime | Install canonical auto-update script
  ansible.builtin.copy:
    dest: /opt/velox/bin/auto-update.sh
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      MASTER="${MASTER_URL:-}"
      VELOX_DIR="{{ velox_dir }}"
      CANONICAL_UNIT="{{ velox_worker_unit_name }}"
      IMAGE="${VELOX_WORKER_IMAGE:-velox-worker:latest}"
      LOG_PREFIX="[auto-update]"
      log() { echo "$LOG_PREFIX $(date '+%Y-%m-%d %H:%M:%S') $*"; }

      log "Starting OS update"
      apt-get update -qq 2>&1 | tail -3
      apt-get upgrade -y -qq --no-install-recommends 2>&1 | tail -5 || log "WARNING: OS upgrade had issues"

      # CANONICAL-ONLY: `$CANONICAL_UNIT` is always set to
      # `velox-worker.service` (see fact resolution at the top of this file).
      # Never use a `velox-worker*.service`
      # wildcard here either — a wildcard could re-introduce a hostile
      # unit that the cleanup block above just masked.
      if [ -n "$MASTER" ]; then
        WORKER_ZIP="/tmp/velox-update-$(date +%s).zip"
        if curl -sf --max-time 60 "$MASTER/api/worker/bundle?platform=linux&arch=x86_64" -o "$WORKER_ZIP" && [ -s "$WORKER_ZIP" ]; then
          rm -rf "$VELOX_DIR/current.new"
          mkdir -p "$VELOX_DIR/current.new"
          if unzip -qo "$WORKER_ZIP" -d "$VELOX_DIR/current.new"; then
            if [ -d "$VELOX_DIR/current.new/refactored" ]; then
              shopt -s dotglob nullglob
              mv -f "$VELOX_DIR/current.new/refactored"/* "$VELOX_DIR/current.new"/ || true
              rm -rf "$VELOX_DIR/current.new/refactored"
            fi
            if [ -f "$VELOX_DIR/current.new/RemoteCodex/native/worker-agent-go/Dockerfile" ]; then
              rm -rf "$VELOX_DIR/current.old"
              [ -d "$VELOX_DIR/current" ] && mv "$VELOX_DIR/current" "$VELOX_DIR/current.old"
              mv "$VELOX_DIR/current.new" "$VELOX_DIR/current"
              if /usr/bin/docker build --pull --no-cache \
                -f "$VELOX_DIR/current/RemoteCodex/native/worker-agent-go/Dockerfile" \
                -t "$IMAGE" "$VELOX_DIR/current"; then
                rm -rf "$VELOX_DIR/current.old"
                log "Bundle and image updated successfully"
              else
                log "ERROR: image build failed; restoring previous release"
                rm -rf "$VELOX_DIR/current.failed"
                mv "$VELOX_DIR/current" "$VELOX_DIR/current.failed"
                mv "$VELOX_DIR/current.old" "$VELOX_DIR/current"
                exit 1
              fi
            else
              rm -rf "$VELOX_DIR/current.new"
              log "WARNING: downloaded bundle has an invalid layout"
            fi
          fi
          rm -f "$WORKER_ZIP"
        else
          rm -f "$WORKER_ZIP"
          log "Bundle download skipped"
        fi
      fi

      systemctl restart "$CANONICAL_UNIT"
      sleep 5
      systemctl is-active --quiet "$CANONICAL_UNIT"
      log "Auto-update completed for $CANONICAL_UNIT"

- name: CanonicalRuntime | Install auto-update service with host env
  ansible.builtin.copy:
    dest: /etc/systemd/system/velox-auto-update.service
    mode: "0644"
    content: |
      [Unit]
      Description=Velox Worker Auto-Update (canonical host runtime)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      EnvironmentFile={{ velox_worker_env_path }}
      ExecStart=/opt/velox/bin/auto-update.sh
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=velox-auto-update
      TimeoutStartSec=600

# ── Bootstrap fixture: engine_selftest_baseline.sha256 ─────────
# Without this file the worker's engine_selftest baseline check has
# nothing to compare against and the worker can silently misreport
# engine readiness. Source lives under the native Go agent tree;
# we copy it into the canonical tests/fixtures path consumed by both
# in-tree and containerized workers.
- name: CanonicalRuntime | Ensure bootstrap fixture directory exists in release tree
  ansible.builtin.file:
    path: "{{ velox_current_root }}/RemoteCodex/tests/fixtures"
    state: directory
    mode: "0755"

- name: CanonicalRuntime | Copy engine selftest baseline fixture into canonical runtime path
  ansible.builtin.copy:
    src: "{{ velox_current_root }}/RemoteCodex/native/worker-agent-go/tests/fixtures/engine_selftest_baseline.sha256"
    dest: "{{ velox_current_root }}/RemoteCodex/tests/fixtures/engine_selftest_baseline.sha256"
    remote_src: true
    mode: preserve

- name: CanonicalRuntime | Inspect existing bundle hash metadata
  ansible.builtin.stat:
    path: "{{ velox_worker_runtime_host_dir }}/work/BUNDLE_HASH.txt"
  register: _bundle_hash_stat

- name: CanonicalRuntime | Write sanitized bundle hash into worker workdir
  ansible.builtin.copy:
    dest: "{{ velox_worker_runtime_host_dir }}/work/BUNDLE_HASH.txt"
    owner: "{{ '10001' if not _bundle_hash_stat.stat.exists else omit }}"
    group: "{{ '10001' if not _bundle_hash_stat.stat.exists else omit }}"
    mode: "{{ '0644' if not _bundle_hash_stat.stat.exists else 'preserve' }}"
    content: "{{ velox_worker_bundle_hash }}\n"

- name: CanonicalRuntime | Create missing bootstrap fixture directory preserving metadata
  ansible.builtin.shell: |
    set -euo pipefail
    path="{{ velox_worker_runtime_host_dir }}/work/tests/fixtures"
    if [ -e "$path" ]; then
      [ -d "$path" ] || { echo "$path exists but is not a directory" >&2; exit 1; }
    else
      mkdir -p "$path"
      chown 10001:10001 "$path"
      chmod 0775 "$path"
      echo "CREATED:$path"
    fi
  args:
    executable: /bin/bash
  register: worker_fixture_dir_result
  changed_when: "'CREATED:' in (stdout | default(''))"

- name: CanonicalRuntime | Inspect existing engine baseline metadata
  ansible.builtin.stat:
    path: "{{ velox_worker_runtime_host_dir }}/work/tests/fixtures/engine_selftest_baseline.sha256"
  register: _engine_baseline_stat

- name: CanonicalRuntime | Copy engine selftest baseline fixture into worker workdir
  ansible.builtin.copy:
    src: "{{ velox_current_root }}/RemoteCodex/tests/fixtures/engine_selftest_baseline.sha256"
    dest: "{{ velox_worker_runtime_host_dir }}/work/tests/fixtures/engine_selftest_baseline.sha256"
    remote_src: true
    owner: "{{ '10001' if not _engine_baseline_stat.stat.exists else omit }}"
    group: "{{ '10001' if not _engine_baseline_stat.stat.exists else omit }}"
    mode: "{{ '0644' if not _engine_baseline_stat.stat.exists else 'preserve' }}"

- name: CanonicalRuntime | Install canonical auto-update timer (12h)
  ansible.builtin.copy:
    dest: /etc/systemd/system/velox-auto-update.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Velox Worker Auto-Update Timer (canonical, 12h)

      [Timer]
      # Defer first run 12h after boot so the worker is stable before update.
      OnBootSec=12h
      OnUnitActiveSec=12h
      # Jitter up to 30 min so workers don't all update at the same instant.
      RandomizedDelaySec=1800
      AccuracySec=60s
      Unit=velox-auto-update.service
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: CanonicalRuntime | Reload systemd after cleanup and unit writes
  ansible.builtin.systemd:
    daemon_reload: true

- name: CanonicalRuntime | Reset canonical unit failure state
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - "{{ velox_worker_unit_name }}"
  changed_when: false
  failed_when: false

- name: CanonicalRuntime | Enable and restart canonical unit
  ansible.builtin.systemd:
    name: "{{ velox_worker_unit_name }}"
    enabled: true
    state: restarted

# ── Assert canonical unit actually came up ──────────────────────
# A `state: restarted` return value only means we issued a restart
# request, not that the unit is healthy. Probe with `systemctl
# is-active` for up to 18s (~6 retries × 3s). If the unit is not
# active, surface the journal for the last 60 lines so the operator
# sees the real failure rather than a generic Ansible error.
- name: CanonicalRuntime | Assert canonical unit is active after restart
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ velox_worker_unit_name }}"
  register: velox_worker_unit_active
  retries: 6
  delay: 3
  until: velox_worker_unit_active.stdout | default('') == 'active'
  changed_when: false
  failed_when: false

- name: CanonicalRuntime | Surface journal of canonical unit on activation failure
  ansible.builtin.command:
    argv:
      - journalctl
      - -u
      - "{{ velox_worker_unit_name }}"
      - -n
      - "60"
      - --no-pager
  register: canonical_unit_journal
  changed_when: false
  failed_when: false
  when:
    - velox_worker_unit_active is defined
    - (velox_worker_unit_active.stdout | default('')) != 'active'

- name: CanonicalRuntime | Fail if canonical unit did not activate
  ansible.builtin.fail:
    msg: >-
      Canonical worker unit {{ velox_worker_unit_name }} failed to activate.
      systemctl is-active → {{ velox_worker_unit_active.stdout | default('unknown') }}.
      Last 60 lines of journal:
      {{ canonical_unit_journal.stdout | default('') }}
  when:
    - velox_worker_unit_active is defined
    - (velox_worker_unit_active.stdout | default('')) != 'active'

- name: CanonicalRuntime | Keep watchdog timer enabled
  ansible.builtin.systemd:
    name: velox-worker-watchdog.timer
    enabled: true
    state: started
  failed_when: false

- name: CanonicalRuntime | Keep auto-update timer enabled
  ansible.builtin.systemd:
    name: velox-auto-update.timer
    enabled: true
    state: started
  failed_when: false
