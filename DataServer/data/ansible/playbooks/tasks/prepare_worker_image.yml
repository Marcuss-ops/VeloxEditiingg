---
# ============================================================
# ACTIVATE WORKER IMAGE — NO REMOTE BUILD
# ============================================================
# This legacy include is fail-closed: it may activate only a full immutable
# GHCR reference. The Dockerfile remains a CI build input, never a production
# deployment input.

- name: PrepareImage | Require immutable image reference
  ansible.builtin.assert:
    that:
      - worker_image_ref is defined
      - worker_image_ref is match('^ghcr\\.io/[a-z0-9._-]+/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$')
    fail_msg: >-
      worker_image_ref must be ghcr.io/<owner>/<repo>@sha256:<64-hex>;
      source bundles and mutable tags are rejected.

- name: PrepareImage | Set immutable image facts
  ansible.builtin.set_fact:
    _worker_image_version: "{{ worker_image_version | default('immutable') }}"
    _worker_image_commit: "{{ worker_image_commit | default('registry-digest') }}"
    _worker_image_tag: "{{ worker_image_ref }}"
    velox_current_root: "{{ velox_dir }}/current"

- name: PrepareImage | Activate exact immutable image
  ansible.builtin.shell: |
    set -euo pipefail
    test -x /usr/local/sbin/velox-worker-activate-image
    /usr/local/sbin/velox-worker-activate-image "{{ worker_image_ref }}"
  args:
    executable: /bin/bash
  register: worker_image_activation
  changed_when: true

- name: PrepareImage | Log immutable activation result
  ansible.builtin.debug:
    msg: "{{ worker_image_activation.stdout | default('immutable image activated') }}"
