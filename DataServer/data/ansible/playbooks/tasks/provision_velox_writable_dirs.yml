---
# ============================================================
# PROVISION VELOX WORKER WRITABLE DIRS
# ============================================================
# TODO: not yet activated — see docs/worker_deployment.md section
# "Runtime writable dirs (proposal)".
#
# Sole responsibility: create the host-side writable runtime tree
# for the velox-worker container, so the container can persist
# cache/sessions/scratch outside the immutable /app/RemoteCodex tree.
#
# Required vars:
#   velox_state_dir — explicit install root for the writable runtime tree.
#                     No fallback is allowed; it is the VELOX_STATE_DIR
#                     contract shared by host and container.
#
# Emits: nothing; this playbook is side-effect only (idempotent
# directory creation with ansible.builtin.file state=directory).
#
# This playbook is INTENTIONALLY MINIMAL. It does NOT touch:
#   - the systemd unit (WorkingDirectory= change is in
#     canonical_worker_runtime.yml);
#   - the worker image (Dockerfile update is a separate track);
#   - cleanup paths (cleanup_worker.yml tracks the new subdirs
#     separately).
#
# Owner UID 10001 = the velox user inside the container (matches
# canonical_worker_runtime.yml). If the canonical UID ever drifts,
# update BOTH this file and canonical_worker_runtime.yml (TODO:
# extract into group_vars/all.yml as velox_user_uid).
# ============================================================

- name: ProvisionVeloxWritableDirs | Create host-side writable runtime directories
  hosts: velox_workers
  gather_facts: true
  vars:
    velox_worker_runtime_host_dir: "{{ velox_state_dir }}"
    # TODO: extract into group_vars/all.yml as velox_user_uid
    # (shared with canonical_worker_runtime.yml).
    velox_writable_dirs_owner: "10001"
    velox_writable_dirs_group: "10001"
    velox_writable_dirs_mode: "0775"
  tasks:
    - name: ProvisionVeloxWritableDirs | Require explicit state directory
      ansible.builtin.assert:
        that:
          - velox_state_dir is defined
          - velox_state_dir | string | length > 0
          - velox_state_dir is match('^/')
          - not (velox_state_dir is search('/\\.\\.?(/|$)'))
        fail_msg: "velox_state_dir is required and must be an absolute path without traversal"

    # Create only missing paths with canonical defaults. Existing owner,
    # mode, ACLs, and contents are intentionally untouched.
    - name: ProvisionVeloxWritableDirs | Create missing runtime directories preserving metadata
      ansible.builtin.shell: |
        set -euo pipefail
        ensure_missing() {
          local path="$1"
          if [ -e "$path" ]; then
            [ -d "$path" ] || { echo "$path exists but is not a directory" >&2; return 1; }
            return 0
          fi
          mkdir -p "$path"
          chown "{{ velox_writable_dirs_owner }}:{{ velox_writable_dirs_group }}" "$path"
          chmod "{{ velox_writable_dirs_mode }}" "$path"
          echo "CREATED:$path"
        }
        ensure_missing "{{ velox_worker_runtime_host_dir }}"
        ensure_missing "{{ velox_worker_runtime_host_dir }}/cache"
        ensure_missing "{{ velox_worker_runtime_host_dir }}/sessions"
        ensure_missing "{{ velox_worker_runtime_host_dir }}/scratch"
      args:
        executable: /bin/bash
      register: provision_writable_dirs_result
      changed_when: "'CREATED:' in (stdout | default(''))"
