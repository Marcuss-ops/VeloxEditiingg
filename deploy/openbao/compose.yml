---
# Velox — OpenBao central secrets manager (deploy/openbao)
# ─────────────────────────────────────────────────────────────────────────────
# Runs the single OpenBao node that will become the central secrets store for
# Velox (KV secrets, machine identities, SSH CA, PKI, DB credentials).
#
# Security posture:
#   * API listener bound to host loopback only (127.0.0.1:8200) — never expose
#     on a public interface without TLS-terminating review. The OpenBao
#     listener itself is TLS-enabled (tls12+) with a self-signed cert
#     generated by scripts/gen-tls.sh into the gitignored state dir.
#   * Raft state lives on the named volume `openbao-data` (survives
#     container recreation; back it up — see README §9).
#   * Unseal keys + root token NEVER live in the repo: bootstrap scripts
#     write them under `<repo>/.velox/openbao/` (gitignored, mode 0600).
#   * OpenBao 2.x runs as the non-root `openbao` user and does NOT require
#     mlock / IPC_LOCK (the `disable_mlock` config key was removed in 2.x —
#     do not add it back).
#
# Config mount: `./config/bao.hcl` → /openbao/config/bao.hcl (read-only).
# TLS mount:    `${OPENBAO_TLS_DIR}` (default ../../.velox/openbao/tls →
#               <repo>/.velox/openbao/tls) → ro.

name: velox-openbao

services:
  openbao:
    image: openbao/openbao:${OPENBAO_VERSION:-2.6.1}

    container_name: velox-openbao

    # Run `server` WITHOUT an explicit -config: the image entrypoint already
    # injects `-config=/openbao/config` (directory scan). Passing our own
    # -config=.../bao.hcl on top produced a "duplicate configuration"
    # warning — the entrypoint scans the whole directory anyway.
    command: ["server"]

    environment:
      # Container-internal client defaults (used by the healthcheck and by
      # `docker exec -it velox-openbao bao ...` operator commands).
      BAO_ADDR: https://127.0.0.1:8200
      BAO_SKIP_VERIFY: "true"
      # Override the default ~/.vault-token home only if needed; the
      # operator-side scripts keep tokens in .velox/openbao/ instead.
      # BAO_TOKEN_PATH: /openbao/data/token

    # Loopback-only binding: the master + workers will reach OpenBao either
    # via an SSH tunnel or from the same host. Change OPENBAO_HOST_PORT in
    # deploy/openbao/.env to move the host port.
    ports:
      - "127.0.0.1:${OPENBAO_HOST_PORT:-8200}:8200"

    volumes:
      # Config dir — scanned by the entrypoint-injected -config (ro: the
      # entrypoint chowns /openbao/config when it can; :ro prevents host
      # file ownership churn and degrades to a cosmetic warning).
      - ./config:/openbao/config:ro
      # Raft data — named volume mounted at /openbao/file (the ONLY data
      # dir shipped in the image, owned by the openbao user uid 100). A
      # fresh volume inherits that ownership, so the non-root container
      # user can write vault.db directly. See config/bao.hcl.
      - openbao-data:/openbao/file
      # TLS listener certs (gen-tls.sh → gitignored state dir). Compose
      # paths are relative to THIS file's dir (deploy/openbao/), so the repo
      # root is ../../ — `../.velox` would silently resolve to infra/.velox.
      # The entrypoint does NOT chown /openbao/tls, so server.key must be
      # group-readable by the container's gid 1000 (gen-tls.sh sets
      # mode 0640 + chgrp 1000 best-effort).
      - ${OPENBAO_TLS_DIR:-../../.velox/openbao/tls}:/openbao/tls:ro

    # `bao status` exits 0 only when the node is initialized AND unsealed.
    # Sealed (503) / uninitialized (501) states keep the container unhealthy.
    healthcheck:
      test: ["CMD", "bao", "status", "-tls-skip-verify"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 30

    restart: unless-stopped

    # NOTE: no `init: true` — the image entrypoint is ALREADY dumb-init
    # (PID 1, see /usr/local/bin/docker-entrypoint.sh shebang), so wrapping
    # it in tini would be redundant.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # Raft integrated-storage persistence (mounted at /openbao/file — the
  # image-owned data dir). Back this volume up (or snapshot it) — losing it
  # loses every secret even if the unseal keys are intact.
  openbao-data:
