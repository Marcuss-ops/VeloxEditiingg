# Velox — canonical worker hardware inventory snapshot artifact.
#
# This file is the canonical operator/audit snapshot artifact, not a runtime
# registry. Worker connectivity and identity remain owned by the Master
# `ansible_hosts` table; immutable runtime identity is recorded in
# `worker_runtime_snapshots`.
# Values below were collected read-only from the four workers and must be
# refreshed from those sources rather than edited by hand.
#
# No credentials, IP addresses, fingerprints, image digests, or secret refs
# belong in this file.

schema: velox.hardware-inventory.v1
source:
  registry: Master SQLite ansible_hosts.worker_id
  runtime_identity: Master SQLite worker_runtime_snapshots
  observation: read-only SSH host facts
  units:
    memory: bytes
    disk: bytes
    cpu: logical CPUs (physical topology intentionally omitted)
    disk_use: percent
  observed_at: "2026-08-07T19:34:29Z"

# Class thresholds are the documented RW-PROD-006/RW-PROD-015 policy.
classes:
  cpu-small:
    min_ram_gb: 4
    max_active: 1
    recommended_swap_gb: 2
  cpu-medium:
    min_ram_gb: 8
    max_active: 2
    recommended_swap_gb: 4
  cpu-xlarge:
    min_ram_gb: 16
    max_active: 4
    recommended_swap_gb: 8

