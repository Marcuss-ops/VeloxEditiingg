---
# Optional configuration reference for workers packaged with Chronon3D.
# The canonical systemd-owned runtime does not start a second Compose project
# or accept direct `docker compose up` commands. Configure the canonical
# /etc/velox-worker/worker.env instead and restart velox-worker.service.
#
# Required values:
#   VELOX_WORKER_IMAGE=ghcr.io/<owner>/velox-chronon-worker@sha256:<digest>
#   VELOX_RENDER_BACKEND=chronon
#   CHRONON3D_CLI=/opt/chronon3d/bin/chronon3d_cli
