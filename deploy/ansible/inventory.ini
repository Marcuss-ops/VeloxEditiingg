# Velox — legacy fleet-operator inventory (Phase 9: NOT canonical).
# ────────────────────────────────────────────────────────────────────────────
# Phase 9 inventory unification: the persistent WorkerNodeRegistry
# (`ansible_hosts` worker-node view in the master SQLite DB) is the SINGLE
# source of truth for fleet connectivity. This file is now a ONE-TIME SEED
# and ops reference only — it is NOT read at deploy time by the master, and
# edits here have no runtime effect. To (re)seed the registry from this
# file:
#
#     velox-admin sync-worker-nodes --db /var/lib/velox-server/velox.db \
#         --inventory deploy/ansible/inventory.ini --apply
#
# The master derives the SSH surface (health probes + smoke) from the
# registry, and the Ansible manager generates the per-operation inventory
# from the same DB — never from this file.
#
# BOOTSTRAP A NEW NODE (host provisioning only — then seed the registry)
#   To onboard a fifth worker, add a sibling line:
#     worker_<short> ansible_host=<real_ip> ansible_user=velox-deploy worker_id=<stable_id>
#   then re-run the provisioning playbook (key-based sudo + Python 3, the
#   /opt/velox-worker directory, and the docker compose template):
#     ansible-playbook -i deploy/ansible/inventory.ini deploy/playbooks/bootstrap-ssh.yml
#   Finally seed the registry with the sync-worker-nodes command above.
#
# HOSTNAME → WORKER_ID MAPPING (kept for reference)
#   The host name (left of `ansible_host=`) IS NOT the worker_id — the
#   worker_id is the stable per-host identifier that the Master's
#   WorkerCard DTO + deployment_records + smoke_runs all key on. Today:
#
#     worker_57_129   → host_57_129_132_133           (HOST=57.129.132.133)
#     worker_57_131   → host_57_131_20_173            (HOST=57.131.20.173)
#     worker_13197    → velox-worker-13197            (HOST=149.56.131.97)
#     worker_523925   → velox-worker-523925eb         (HOST=51.222.204.158)
#
# GUARD RAILS (kept for provisioning playbooks)
#   1. [velox_workers] MUST be non-empty (canonical invariant). Empty
#      groups fail the play's first pre_task with `assert`.
#   2. Each worker_id MUST be non-blank, non-wildcard ('*'), and
#      unique within the group. Same `assert` covers this.
#   3. SSH key-based auth; passwordless sudo. Key: ~/.ssh/id_ed25519.
#
# ACCESS STATUS (2026-07-29):
#   worker_57_131  ✅ Key auth + sudo OK (pierone)
#   worker_523925  ✅ Key auth + sudo OK (pierone)
#   worker_13197   ✅ Key auth + sudo OK (pierone)
#   worker_57_129  ✅ Key auth + sudo OK (pierone)
#
# NOT IN THIS INVENTORY
#   - The Velox master. Master admin endpoints are reached from
#     `delegate_to: localhost` (the operator's workstation) over the
#     REST :8000 listener — see ansible: `velox_master_public_url` +
#     `velox_master_port` in deploy/group_vars/all.yml.
#   - `youtube_king` — the operator's personal computer. NOT a Velox
#     worker; do NOT add it here.

[velox_workers]
worker_57_129  ansible_host=57.129.132.133 ansible_user=pierone ansible_ssh_private_key_file=~/.ssh/id_ed25519 worker_id=host_57_129_132_133
worker_57_131  ansible_host=57.131.20.173  ansible_user=pierone ansible_ssh_private_key_file=~/.ssh/id_ed25519 worker_id=host_57_131_20_173
worker_13197   ansible_host=149.56.131.97  ansible_user=pierone ansible_ssh_private_key_file=~/.ssh/id_ed25519 worker_id=velox-worker-13197
worker_523925  ansible_host=51.222.204.158 ansible_user=pierone ansible_ssh_private_key_file=~/.ssh/id_ed25519 worker_id=velox-worker-523925eb

[velox_workers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
