# Velox — fleet-operator inventory (Step 11/15).
# ────────────────────────────────────────────────────────────────────────────
# This inventory is the source of truth for the 8 fleet-operator playbooks
# (deploy/playbooks/fleet-{status,health,drain,update,restart,smoke,rollback,logs}.yml).
# Each playbook runs with `serial: 1` + `any_errors_fatal: true` so a failure
# on one worker halts the entire run before touching the next worker — the
# canonical "stop al primo fail" semantics from the user spec.
#
# BOOTSTRAP A NEW NODE
#   To onboard a fifth worker, add a sibling line:
#     worker_<short> ansible_host=<real_ip> ansible_user=velox-deploy worker_id=<stable_id>
#   then re-run:
#     ansible-playbook -i deploy/ansible/inventory.ini deploy/playbooks/bootstrap-ssh.yml
#   The bootstrap-ssh playbook ensures key-based sudo + Python 3, the
#   /opt/velox-worker directory, and the docker compose template.
#
# HOSTNAME → WORKER_ID MAPPING
#   The host name (left of `ansible_host=`) IS NOT the worker_id — the
#   worker_id is the stable per-host identifier that the Master's
#   Step 1/15 WorkerCard DTO + Step 5/15 deployment_records + Step 12/15
#   smoke_runs all key on. Today:
#
#     worker_57_129   → host_57_129_132_133           (HOST=57.129.132.133)
#     worker_57_131   → host_57_131_20_173            (HOST=57.131.20.173)
#     worker_13197    → velox-worker-13197            (HOST=149.56.131.97)
#     worker_523925   → velox-worker-523925eb         (HOST=51.222.204.158)
#
# GUARD RAILS (visible here, enforced by fleet playbooks)
#   1. [velox_workers] MUST be non-empty (canonical invariant). Empty
#      groups fail the play's first pre_task with `assert`.
#   2. Each worker_id MUST be non-blank, non-wildcard ('*'), and
#      unique within the group. Same `assert` covers this.
#   3. SSH key-based auth as user `velox-deploy`; passwordless sudo.
#      Key: ~/.ssh/id_ed25519_velox (generated 2026-07-29).
#      Operators that previously used a different ansible_user MUST
#      edit this file and re-run bootstrap-ssh.yml.
#
# ACCESS STATUS (2026-07-29):
#   worker_57_131  ✅ Key auth + sudo OK (debian)
#   worker_523925  ✅ Key auth + sudo OK (ubuntu)
#   worker_13197   ✅ Key auth + sudo OK (pierone)
#   worker_57_129  ✅ Key auth + sudo OK (pierone)
#
# CONVENZIONE PASSWORD (valida per worker Debian/Ubuntu):
#   sudo: ciao
#   SSH: autenticazione via chiave ed25519
#
# NOT IN THIS INVENTORY
#   - The Velox master. Master admin endpoints are reached from
#     `delegate_to: localhost` (the operator's workstation) over the
#     REST :8000 listener — see ansible: `velox_master_public_url` +
#     `velox_master_port` in deploy/group_vars/all.yml.
#   - `youtube_king` — the operator's personal computer. NOT a Velox
#     worker; do NOT add it here.

[velox_workers]
worker_57_129  ansible_host=57.129.132.133 ansible_user=pierone ansible_ssh_private_key_file=~/.ssh/id_ed25519_velox worker_id=host_57_129_132_133
worker_57_131  ansible_host=57.131.20.173  ansible_user=debian ansible_ssh_private_key_file=~/.ssh/id_ed25519_velox worker_id=host_57_131_20_173
worker_13197   ansible_host=149.56.131.97  ansible_user=pierone ansible_ssh_private_key_file=~/.ssh/id_ed25519_velox worker_id=velox-worker-13197
worker_523925  ansible_host=51.222.204.158 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519_velox worker_id=velox-worker-523925eb

[velox_workers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
