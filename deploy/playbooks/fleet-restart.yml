---
# fleet-restart — Velox fleet-operator (Step 11/15).
# ────────────────────────────────────────────────────────────────────────────
# Restart the single canonical systemd-owned worker runtime for one worker
# at a time, stop at first fail. There is intentionally no raw docker or
# per-worker Compose-project fallback: velox-worker.service is the sole owner.
#
# ROUTING: SSH direct on the worker host. The container is bound to the
# host, not the master. Master has no `docker` socket.
#
# ⚠ Container restart is NOT coordinated with the Master. Operators
# who restart a draining worker mid-render will see the operations
# recover when the worker reconnects (Step 1/15 registry heartbeat +
# task-grace-period).
#
# STOP AL PRIMO FAIL: serial: 1 + any_errors_fatal: true.
#
# Usage:
#   ansible-playbook -i deploy/ansible/inventory.ini \
#     --ask-vault-pass \
#     deploy/playbooks/fleet-restart.yml

- name: Fleet restart — container restart per worker (compose or raw)
  hosts: velox_workers
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  connection: ssh
  become: true

  vars:
    canonical_unit: velox-worker.service

  tasks:
    - name: Restart canonical systemd worker runtime ({{ worker_id }})
      ansible.builtin.systemd:
        name: "{{ canonical_unit }}"
        state: restarted
        daemon_reload: true
      register: restart_run

    - name: Wait for /health/ready on the worker loopback
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/health/ready"
        method: GET
        status_code: 200
        timeout: 5
      register: health_ready
      until: health_ready.status == 200
      retries: 12          # 12 × 5s = 60s
      delay: 5
      failed_when: health_ready.status != 200

    - name: Announce restart healthy for {{ worker_id }}
      ansible.builtin.debug:
        msg: >-
          [{{ worker_id }}] canonical systemd restart OK;
          /health/ready returned 200; the master will see the
          re-registration on the next heartbeat tick (Step 1/15).
