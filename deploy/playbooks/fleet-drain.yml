---
# fleet-drain — Velox fleet-operator (Step 11/15).
# ────────────────────────────────────────────────────────────────────────────
# Drain a single worker — Master sets WorkerInfo.Drain = true and waits
# for active_jobs = 0 before considering the transition complete (Step
# 6/15 surface). Playbook runs drain on every worker in [velox_workers]
# serially (one worker at a time, stop at first fail).
#
# ROUTING: HTTP delegate to master REST :8000. Master owns:
#   - registry.GetWorker/SetWorkerDrain (Step 1/15 + Step 6/15)
#   - placement matcher exclusion (DRAINING excludes from new leases)
#   - audit lifecycle on fleet_operations (Step 4/15)
#
# The playbook POSTs the mutation, captures operation_id, polls
# fleet_operations ledger via GET /api/v1/admin/operations/{id} until
# SUCCEEDED or FAILED. On FAILED: the audit row's error_message is
# surfaced verbatim so the operator sees the canonical sentinel
# (e.g., "workers_still_active_for_drain").
#
# STOP AL PRIMO FAIL: serial: 1 + any_errors_fatal: true. A failure on
# worker 1 halts the play before worker 2 is touched.
#
# Usage:
#   ansible-playbook -i deploy/ansible/inventory.ini \
#     --ask-vault-pass \
#     deploy/playbooks/fleet-drain.yml
#
# Optional -e override:
#   -e drain_reason="manual drain for cert rotation"

- name: fleet-drain — DRAINING transition per worker (Step 6/15)
  hosts: velox_workers
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  connection: local
  become: false

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault.yml

  vars:
    drain_reason: "{{ drain_reason | default('ansible fleet-drain serial:1') }}"
    velox_poll_attempts: 120   # 120 × 5s = 600s = 10 min
    velox_poll_delay_sec: 5

  tasks:
    - name: POST /api/v1/admin/workers/{{ worker_id }}/drain to master
      ansible.builtin.uri:
        url: "https://{{ velox_master_public_url }}:{{ velox_master_port }}/api/v1/admin/workers/{{ worker_id }}/drain"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_velox_admin_token }}"
        body_format: json
        body:
          reason: "{{ drain_reason }}"
          requested_by: "ansible"
        validate_certs: true
        timeout: 30
        status_code: [202, 409]
      register: drain_post
      failed_when: drain_post.status not in [202, 409]

    - name: Skip polling if drain returned 409 Conflict (already draining / in-flight)
      ansible.builtin.debug:
        msg: >-
          Worker {{ worker_id }} drain returned HTTP 409 —
          likely already-draining or operation in-flight.
          Manual check on /api/v1/admin/operations recommended.
      when: drain_post.status == 409

    - name: Poll operation ledger for terminal state on worker {{ worker_id }}
      ansible.builtin.uri:
        url: "https://{{ velox_master_public_url }}:{{ velox_master_port }}/api/v1/admin/operations/{{ drain_post.json.operation_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_velox_admin_token }}"
        validate_certs: true
        timeout: 30
      register: drain_poll
      until: drain_poll.json.status in ['SUCCEEDED', 'FAILED']
      retries: "{{ velox_poll_attempts }}"
      delay: "{{ velox_poll_delay_sec }}"
      when: drain_post.status == 202

    - name: Fail the play if drain operation ended FAILED for {{ worker_id }}
      ansible.builtin.fail:
        msg: >-
          DRAIN failed for worker {{ worker_id }} — operation
          {{ drain_post.json.operation_id }} ended with status
          {{ drain_poll.json.status }} and error_message:
          {{ drain_poll.json.error_message | default('— (no error_message surfaced)') }}.
          Operator MUST triage before re-running fleet-.
      when:
        - drain_post.status == 202
        - drain_poll.json.status == 'FAILED'

    - name: Announce DRAIN success for {{ worker_id }}
      ansible.builtin.debug:
        msg: >-
          [{{ worker_id }}] DRAIN → SUCCEEDED
          (operation_id={{ drain_post.json.operation_id }}).
      when:
        - drain_post.status == 202
        - drain_poll.json.status == 'SUCCEEDED'
