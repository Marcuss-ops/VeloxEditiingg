---
# fleet-status — Velox fleet-operator (Step 11/15).
# ────────────────────────────────────────────────────────────────────────────
# Print the canonical WorkerCard per worker (Step 1/15 surface) so the
# operator sees worker_id, hostname, status, session_active, executor +
# version, image_digest, software_version, desired_version,
# last_heartbeat_at, active_jobs/max, health, deployment_state,
# last_smoke_status/at, last_restart_at for each member of [velox_workers].
#
# ROUTING: HTTP delegate to the master (REST :8000). The Master owns the
# registry state — there's nothing reachable on the worker host over SSH
# that mirrors the WorkerCard shape.
#
# STOP AL PRIMO FAIL: serial: 1 + any_errors_fatal: true — a 4xx/5xx from
# the master on the first worker halts the play immediately, before the
# second through fourth workers are queried. The operator runs the
# playbook again once they triage the failure.
#
# Usage:
#   ansible-playbook -i deploy/ansible/inventory.ini \
#     --ask-vault-pass \
#     deploy/playbooks/fleet-status.yml
#
# Output:
#   One debug task per worker; each prints the JSON WorkerCard.

- name: fleet-status — print WorkerCard for every worker (Step 1/15)
  hosts: velox_workers
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  connection: local
  become: false

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault.yml

  vars:
    velox_poll_attempts: 1   # status is synchronous; no polling
    velox_poll_delay_sec: 0

  pre_tasks:
    - name: Assert inventory preconditions
      ansible.builtin.assert:
        that:
          - worker_id is defined
          - worker_id | length > 0
          - worker_id != '*'
          - groups['velox_workers'] | length >= 1
        fail_msg: >-
          Fleet playbooks require a populated, non-wildcard
          [velox_workers] group. Edit deploy/ansible/inventory.ini
          and re-run.
        success_msg: "Inventory preconditions OK (workers={{ groups['velox_workers'] | length }})."

  tasks:
    - name: Fetch WorkerCard from master for {{ worker_id }}
      ansible.builtin.uri:
        url: "https://{{ velox_master_public_url }}:{{ velox_master_port }}/api/v1/admin/workers/{{ worker_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_velox_admin_token }}"
        validate_certs: true
        timeout: 30
        status_code: 200
      register: worker_card
      failed_when: false

    - name: Print WorkerCard for {{ worker_id }}
      ansible.builtin.debug:
        msg: >-
          [{{ worker_id }}] status={{ worker_card.json.status | default('UNREACHABLE') }}
          health={{ worker_card.json.health | default('—') }}
          session_active={{ worker_card.json.session_active | default('—') }}
          executor={{ worker_card.json.executor | default('—') }}@{{ worker_card.json.executor_version | default('—') }}
          image_digest={{ worker_card.json.image_digest | default('—') }}
          software_version={{ worker_card.json.software_version | default('—') }}
          desired_version={{ worker_card.json.desired_version | default('—') }}
          active_jobs={{ worker_card.json.active_jobs | default('—') }}/{{ worker_card.json.max_active_jobs | default('—') }}
          deployment_state={{ worker_card.json.deployment_state | default('—') }}
          last_smoke={{ worker_card.json.last_smoke_status | default('—') }}@{{ worker_card.json.last_smoke_at | default('—') }}
          last_restart_at={{ worker_card.json.last_restart_at | default('—') }}
      when: worker_card.status == 200

    - name: Fail the play if master returned non-200 for {{ worker_id }}
      ansible.builtin.fail:
        msg: >-
          Master returned HTTP {{ worker_card.status }} for worker
          {{ worker_id }} (body={{ worker_card.content | default('—') }}).
          fleet-status aborts the run — the operator must triage
          before re-running.
      when: worker_card.status != 200
