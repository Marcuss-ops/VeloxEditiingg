---
# fleet-rollback — Velox fleet-operator (Step 11/15).
# ────────────────────────────────────────────────────────────────────────────
# Re-run the Step 9/15 rollback cascade for one worker at a time, stop at
# first fail. The cascade:
#
#   snapshot current (broken) digest
#   → pull image @previous_digest with Cosign verify
#   → docker compose -p velox-worker restart with previous image
#   → /health/ready check on the new container
#   → Master reconnect (CONNECTED + session_active)
#   → smoke (optional; drive separately via fleet-smoke)
#   → mark SUCCEEDED on deployment_records row
#
# ROLLBACK IS DIFFERENT FROM RESTART
#   * `fleet-rollback` re-issues the Step 9/15 UpdateExecutor path with
#     target_digest = previous_digest from deployment_records. The Master
#     re-runs Cosign verify + smoke + level-D probe + drives audit.
#   * `fleet-restart` just restarts the existing container without
#     changing the image — used for transient cleanup recovery.
#
# ROUTING: HTTP delegate to master REST :8000. The Master owns the
# rollback executor + the audit. Direct SSH-level docker pull would
# bypass:
#   * the deployment_records ledger (Step 5/15)
#   * the rollback cascade co-routine (Step 9/15)
#   * the Cosign verification gate
# and is therefore FORBIDDEN.
#
# STOP AL PRIMO FAIL: serial: 1 + any_errors_fatal: true.
#
# Usage:
#   ansible-playbook -i deploy/ansible/inventory.ini \
#     --ask-vault-pass \
#     deploy/playbooks/fleet-rollback.yml
#
#   # Optional -e overrides:
#   -e rollback_target_deployment_id=deploy-20260728-001
#   -e rollback_reason="manual rollback from ansible"

- name: fleet-rollback — Step 9/15 rollback cascade per worker
  hosts: velox_workers
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  connection: local
  become: false

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault.yml

  vars:
    rollback_target_deployment_id: "{{ rollback_target_deployment_id | default('') }}"
    rollback_reason: "{{ rollback_reason | default('ansible fleet-rollback serial:1') }}"
    # Step 9/15 rollback cascade budget is the same as forward (30min opTimeout).
    velox_poll_attempts: 360   # 360 × 5s = 1800s = 30 min
    velox_poll_delay_sec: 5

  tasks:
    - name: POST /api/v1/admin/workers/{{ worker_id }}/rollback to master
      ansible.builtin.uri:
        url: "https://{{ velox_master_public_url }}:{{ velox_master_port }}/api/v1/admin/workers/{{ worker_id }}/rollback"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_velox_admin_token }}"
        body_format: json
        body:
          deployment_id: "{{ rollback_target_deployment_id }}"
          reason: "{{ rollback_reason }}"
          requested_by: "ansible"
        validate_certs: true
        timeout: 30
        status_code: [202, 409]
      register: rollback_post
      failed_when: rollback_post.status not in [202, 409]

    - name: Skip polling if rollback returned 409 (operation in-flight)
      ansible.builtin.debug:
        msg: >-
          Worker {{ worker_id }} rollback returned HTTP 409 —
          a forward or rollback operation is already in-flight.
          Triage /api/v1/admin/operations before re-running.
      when: rollback_post.status == 409

    - name: Poll rollback operation until terminal for {{ worker_id }}
      ansible.builtin.uri:
        url: "https://{{ velox_master_public_url }}:{{ velox_master_port }}/api/v1/admin/operations/{{ rollback_post.json.operation_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_velox_admin_token }}"
        validate_certs: true
        timeout: 30
      register: rollback_poll
      until: rollback_poll.json.status in ['SUCCEEDED', 'FAILED', 'ROLLBACK']
      retries: "{{ velox_poll_attempts }}"
      delay: "{{ velox_poll_delay_sec }}"
      when: rollback_post.status == 202

    - name: Fail the play if rollback ended FAILED for {{ worker_id }}
      ansible.builtin.fail:
        msg: >-
          Rollback failed for worker {{ worker_id }} — operation
          {{ rollback_post.json.operation_id }} ended with status
          {{ rollback_poll.json.status }} and error_message:
          {{ rollback_poll.json.error_message | default('—') }}.
          Operator MUST triage before re-running fleet-rollback;
          the worker may be in a partial-rollback state.
      when:
        - rollback_post.status == 202
        - rollback_poll.json.status in ['FAILED', 'ROLLBACK']

    - name: Announce rollback success for {{ worker_id }}
      ansible.builtin.debug:
        msg: >-
          [{{ worker_id }}] ROLLBACK → SUCCEEDED
          (operation_id={{ rollback_post.json.operation_id }}).
          Master reverted to previous_digest and marked the
          deployment_records row ROLLED_BACK per Step 9/15.
      when:
        - rollback_post.status == 202
        - rollback_poll.json.status == 'SUCCEEDED'
