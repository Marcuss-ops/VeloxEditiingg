---
# Roll out one pinned worker image at a time.
# The operator must drain the worker and wait for active_jobs=0 before
# invoking this playbook. A failed prepare/health check restores the exact
# previous env file and reruns the host converger before failing the play.
#
# Compatibility gate: this playbook is the GHCR host-mutation bridge in the
# phased legacy-worker removal (docs/operations/legacy-worker-removal-plan.md,
# Phase 1/2). It MUST keep the release-verification contract intact:
#   - rollout_expected_bundle_hash / rollout_expected_engine_sha256
#     (current-commit release provenance, gate via verify-worker-image.sh);
#   - master reconnect (CONNECTED + session_active + fresh heartbeat);
#   - POST Level-D smoke operation for the target worker;
#   - verify persisted Level-D Drive artifact upload.
# scripts/ci/check-worker-rollout-compatibility.py asserts these stay
# present. Do not bypass the gate with a flag; restore compatibility.
#
# Master verification requires the admin bearer token:
#   -e velox_admin_token=<admin-token>
# The play fails closed (before mutation) when the token is missing and the
# release-evidence hashes are absent, so a rollout can never be certified
# without evidence.

- name: Roll out pinned Velox worker image
  hosts: velox_workers
  serial: 1
  become: true
  gather_facts: false
  vars:
    worker_env_path: /etc/velox-worker/worker.env
    prepare_host_path: /opt/velox/current/deploy/runtime/prepare-host.sh
    health_port: 8081
    deployment_id: "deploy-{{ lookup('pipe', 'date -u +%Y%m%d%H%M%S') }}"
    target_image: ""
    rollback_image: ""
    # Release provenance (Phase 3/4 evidence). Both are 64-hex; the engine
    # SHA is also re-verified inside the container by verify-worker-image.sh.
    rollout_expected_bundle_hash: "{{ rollout_expected_bundle_hash | default('') }}"
    rollout_expected_engine_sha256: "{{ rollout_expected_engine_sha256 | default('') }}"
    # Master REST endpoint + admin token for the post-rollout reconnect and
    # Level-D smoke verification. Same surface fleet-update/fleet-smoke use.
    # Defaults from the operator-supplied master_url (fleetctl passes it), so
    # verification never targets the worker host's own loopback by accident.
    velox_master_verify_url: "{{ velox_master_verify_url | default(master_url | default('http://127.0.0.1:8000')) }}"
    velox_admin_token: "{{ velox_admin_token | default('') }}"
    velox_master_validate_certs: "{{ velox_master_validate_certs | default(false) }}"
    rollout_smoke_asset_id: "{{ rollout_smoke_asset_id | default('asset-canary-001') }}"
    velox_poll_attempts: 144   # 144 x 5s = 720s = 12 min (smoke + drive budget)
    velox_poll_delay_sec: 5

  pre_tasks:
    - name: Validate target image digest
      ansible.builtin.assert:
        that:
          - target_image | length > 0
          - target_image is match('^ghcr\\.io/[a-z0-9._-]+/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$')
        fail_msg: "target_image must be a pinned lowercase GHCR @sha256:64 image"

    - name: Validate worker env and prepare-host paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ worker_env_path }}"
        - "{{ prepare_host_path }}"
      register: rollout_paths

    - name: Require worker env and prepare-host
      ansible.builtin.assert:
        that:
          - rollout_paths.results[0].stat.exists
          - rollout_paths.results[1].stat.exists
          - rollout_paths.results[1].stat.executable
        fail_msg: "worker env or executable prepare-host.sh is missing on {{ inventory_hostname }}"

    - name: Require release provenance for rollout certification
      ansible.builtin.assert:
        that:
          - rollout_expected_bundle_hash is match('^[0-9a-fA-F]{64}$')
          - rollout_expected_engine_sha256 is match('^[0-9a-fA-F]{64}$')
        fail_msg: >-
          rollout-worker-digest requires the current-commit release evidence:
          -e rollout_expected_bundle_hash=<64-hex>
          -e rollout_expected_engine_sha256=<64-hex>
          (read from the worker-image workflow artifacts; never omit).

    - name: Require master admin token for reconnect/smoke verification
      ansible.builtin.assert:
        that:
          - velox_admin_token | length > 0
        fail_msg: >-
          rollout-worker-digest requires -e velox_admin_token=<admin-token>
          so the post-rollout master reconnect and Level-D smoke verification
          can run. The play fails closed before mutation when absent.

    - name: Read current worker env
      ansible.builtin.slurp:
        src: "{{ worker_env_path }}"
      register: previous_env

    - name: Extract current image reference
      ansible.builtin.set_fact:
        previous_image: >-
          {{ (previous_env.content | b64decode | regex_findall('(?m)^VELOX_WORKER_IMAGE=(.+)$') | first) | default('', true) }}

    - name: Require current image reference for rollback
      ansible.builtin.assert:
        that:
          - previous_image | length > 0
        fail_msg: "VELOX_WORKER_IMAGE is missing from {{ worker_env_path }}"

    - name: Create deployment audit directory
      ansible.builtin.file:
        path: "/var/lib/velox-worker/deployments/{{ deployment_id }}"
        state: directory
        mode: "0750"

    - name: Save deployment manifest
      ansible.builtin.copy:
        dest: "/var/lib/velox-worker/deployments/{{ deployment_id }}/deployment.json"
        mode: "0640"
        content: |
          {
            "deployment_id": {{ deployment_id | to_json }},
            "worker_id": {{ (worker_id | default(inventory_hostname)) | to_json }},
            "previous_image": {{ previous_image | to_json }},
            "target_image": {{ target_image | to_json }},
            "expected_bundle_hash": {{ rollout_expected_bundle_hash | to_json }},
            "expected_engine_sha256": {{ rollout_expected_engine_sha256 | to_json }},
            "status": "UPDATING"
          }

    - name: Save exact previous worker env
      ansible.builtin.copy:
        content: "{{ previous_env.content | b64decode }}"
        dest: "/var/lib/velox-worker/deployments/{{ deployment_id }}/worker.env.previous"
        mode: "0640"

  tasks:
    - name: Apply pinned image and converge runtime
      block:
        - name: Set target image in worker env
          ansible.builtin.lineinfile:
            path: "{{ worker_env_path }}"
            regexp: '^VELOX_WORKER_IMAGE='
            line: "VELOX_WORKER_IMAGE={{ target_image }}"
            create: false
            backup: true

        - name: Run prepare-host for target image
          ansible.builtin.command:
            argv:
              - "{{ prepare_host_path }}"
          environment:
            ENV_FILE: "{{ worker_env_path }}"

        - name: Verify worker readiness after rollout
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ health_port }}/health/ready"
            status_code: 200
            timeout: 5
          register: rollout_health
          retries: 6
          delay: 5
          until: rollout_health.status | default(0) == 200

        - name: Verify container-level engine SHA-256 against release evidence
          ansible.builtin.shell: |
            set -euo pipefail
            /usr/bin/bash \
              "{{ prepare_host_path | dirname | dirname | dirname }}/RemoteCodex/scripts/verify-worker-image.sh" \
              "{{ target_image }}" \
              "{{ rollout_expected_engine_sha256 }}"
          args:
            executable: /bin/bash
          register: rollout_engine_verify
          failed_when: rollout_engine_verify.rc != 0
          changed_when: false

        # ── MASTER RECONNECT (CONNECTED + session_active + fresh heartbeat) ─
        # Same WorkerCard surface fleet-status reads. The worker must be
        # CONNECTED with an active session and a heartbeat within the stale
        # threshold before the rollout is certified.
        - name: Verify master reconnect, session and fresh heartbeat
          ansible.builtin.uri:
            url: "{{ velox_master_verify_url }}/api/v1/admin/workers/{{ worker_id | default(inventory_hostname) | urlencode }}"
            method: GET
            headers:
              Authorization: "Bearer {{ velox_admin_token }}"
            validate_certs: "{{ velox_master_validate_certs }}"
            timeout: 30
            status_code: 200
          register: rollout_worker_card
          retries: 12
          delay: 5
          until: rollout_worker_card.status | default(0) == 200

        - name: Assert worker reconnected with active session and fresh heartbeat
          ansible.builtin.assert:
            that:
              - (rollout_worker_card.json.status | default('')) in ['CONNECTED', 'connected']
              - (rollout_worker_card.json.session_active | default(false)) | bool
              - (rollout_worker_card.json.last_heartbeat_at | default('')) | length > 0
            fail_msg: >-
              Worker {{ worker_id | default(inventory_hostname) }} did NOT
              reconnect after rollout (status={{ rollout_worker_card.json.status | default('—') }}
              session_active={{ rollout_worker_card.json.session_active | default('—') }}
              last_heartbeat_at={{ rollout_worker_card.json.last_heartbeat_at | default('—') }}).
              Operator MUST triage before marking the deployment CURRENT.

        # ── LEVEL-D SMOKE (lease → download → ffmpeg → Drive) ─────────────
        # Same OperationKindSmoke surface fleet-smoke posts; the master owns
        # the LevelDSmokeExecutor + smoke_runs ledger.
        - name: POST Level-D smoke operation for the target worker
          ansible.builtin.uri:
            url: "{{ velox_master_verify_url }}/api/v1/admin/workers/{{ worker_id | default(inventory_hostname) | urlencode }}/smoke"
            method: POST
            headers:
              Authorization: "Bearer {{ velox_admin_token }}"
            body_format: json
            body:
              asset_id: "{{ rollout_smoke_asset_id }}"
              reason: "ansible rollout-worker-digest post-rollout Level-D smoke"
            validate_certs: "{{ velox_master_validate_certs }}"
            timeout: 30
            status_code: [202, 409]
          register: rollout_smoke_post
          failed_when: rollout_smoke_post.status not in [202, 409]

        - name: Poll smoke operation until terminal for the target worker
          ansible.builtin.uri:
            url: "{{ velox_master_verify_url }}/api/v1/admin/operations/{{ rollout_smoke_post.json.operation_id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ velox_admin_token }}"
            validate_certs: "{{ velox_master_validate_certs }}"
            timeout: 30
          register: rollout_smoke_poll
          until: rollout_smoke_poll.json.status in ['SUCCEEDED', 'FAILED']
          retries: "{{ velox_poll_attempts }}"
          delay: "{{ velox_poll_delay_sec }}"
          when: rollout_smoke_post.status == 202

        - name: Fail the rollout if the Level-D smoke ended FAILED
          ansible.builtin.fail:
            msg: >-
              Post-rollout Level-D smoke FAILED for worker
              {{ worker_id | default(inventory_hostname) }} —
              operation {{ rollout_smoke_post.json.operation_id }}:
              {{ rollout_smoke_poll.json.error_message | default('—') }}.
              Automatic rollback follows.
          when:
            - rollout_smoke_post.status == 202
            - rollout_smoke_poll.json.status == 'FAILED'

        # ── PERSISTED DRIVE ARTIFACT ───────────────────────────────────────
        # The smoke_runs row must carry the Drive artifact id; an empty value
        # means the upload leg never persisted and the rollout is not proven.
        - name: Verify persisted Level-D Drive artifact upload
          ansible.builtin.uri:
            url: "{{ velox_master_verify_url }}/api/v1/admin/workers/{{ worker_id | default(inventory_hostname) | urlencode }}/smokes/latest"
            method: GET
            headers:
              Authorization: "Bearer {{ velox_admin_token }}"
            validate_certs: "{{ velox_master_validate_certs }}"
            timeout: 30
          register: rollout_smoke_row
          failed_when: false
          when:
            - rollout_smoke_post.status == 202
            - rollout_smoke_poll.json.status == 'SUCCEEDED'

        - name: Assert smoke Drive artifact is persisted
          ansible.builtin.assert:
            that:
              - (rollout_smoke_row.json.artifact_drive_id | default('')) | length > 0
            fail_msg: >-
              Level-D smoke for worker {{ worker_id | default(inventory_hostname) }}
              succeeded but the smoke_runs row has no artifact_drive_id — the
              Drive delivery leg did not persist evidence. Do NOT mark the
              deployment CURRENT; triage Drive before continuing.
          when:
            - rollout_smoke_post.status == 202
            - rollout_smoke_poll.json.status == 'SUCCEEDED'

        - name: Mark deployment current
          ansible.builtin.replace:
            path: "/var/lib/velox-worker/deployments/{{ deployment_id }}/deployment.json"
            regexp: '"status": "UPDATING"'
            replace: '"status": "CURRENT"'

      rescue:
        - name: Restore previous worker env
          ansible.builtin.copy:
            src: "/var/lib/velox-worker/deployments/{{ deployment_id }}/worker.env.previous"
            dest: "{{ worker_env_path }}"
            remote_src: true
            mode: "0640"

        - name: Re-converge previous worker runtime
          ansible.builtin.command:
            argv:
              - "{{ prepare_host_path }}"
          environment:
            ENV_FILE: "{{ worker_env_path }}"
          failed_when: false

        - name: Mark deployment rolled back
          ansible.builtin.replace:
            path: "/var/lib/velox-worker/deployments/{{ deployment_id }}/deployment.json"
            regexp: '"status": "UPDATING"'
            replace: '"status": "ROLLED_BACK"'

        - name: Fail rollout after automatic rollback
          ansible.builtin.fail:
            msg: "worker image rollout failed; previous env restored on {{ inventory_hostname }}"
