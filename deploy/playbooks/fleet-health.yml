---
# fleet-health — Velox fleet-operator (Step 11/15).
# ────────────────────────────────────────────────────────────────────────────
# Run the canonical 4-level health probe (Step 10/15 surface) for every
# worker in [velox_workers], one worker at a time. Default level = A
# (host checks: SSH up, CPU load 1m, RAM, disk, docker active, NTP).
# Operators pick the level via `-e health_level=B|C|D`:
#   A — host checks (ssh_up, cpu, memory, disk, docker, ntp)
#   B — container (running, /health/ready, image_digest, restart-loop)
#   C — Master connection (CONNECTED, session_active, executor, heartbeat)
#   D — end-to-end smoke (lease → download → ffmpeg → Drive delivery)
#
# ROUTING: HTTP delegate to the master REST :8000. The Master owns the
# 4-level probe (Step 10/15's HealthProbe + fleet_operations audit).
# Levels A and B today route via SSH inside the Master through the
# fleet.BackendSSHClient (not yet wired under the Step 11+ downstream
# commit — see deploy/playbooks/fleet-status.yml header). The probe
# surface itself converges through the master every time.
#
# STOP AL PRIMO FAIL: serial: 1 + any_errors_fatal: true.
#
# Usage:
#   # Default level A:
#   ansible-playbook -i deploy/ansible/inventory.ini \
#     --ask-vault-pass \
#     deploy/playbooks/fleet-health.yml
#
#   # Level D (real end-to-end smoke; runs the same LevelDSmokeExecutor
#   # Step 12/15 orchestrates, and stamps duration_ms on smoke_runs):
#   ansible-playbook -i deploy/ansible/inventory.ini \
#     --ask-vault-pass \
#     -e health_level=D \
#     deploy/playbooks/fleet-health.yml

- name: fleet-health — 4-level health probe per worker (Step 10/15)
  hosts: velox_workers
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  connection: local
  become: false

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault.yml

  vars:
    # Single definition: normalize an operator-supplied level (A|B|C|D,
    # any case) once. The previous two-key form was a YAML duplicate-key
    # mapping where the second silently shadowed the first.
    health_level: "{{ health_level | default('A') | upper }}"
    velox_poll_attempts: 1
    velox_poll_delay_sec: 0

  pre_tasks:
    - name: Assert level is one of A/B/C/D
      ansible.builtin.assert:
        that:
          - health_level in ['A', 'B', 'C', 'D']
        fail_msg: >-
          health_level must be A, B, C, or D. Pass
          -e health_level=D for the Level-D end-to-end smoke probe.
        success_msg: "Probing level {{ health_level }} for {{ groups['velox_workers'] | length }} workers."

  tasks:
    - name: Probe level {{ health_level }} health for {{ worker_id }}
      ansible.builtin.uri:
        url: "https://{{ velox_master_public_url }}:{{ velox_master_port }}/api/v1/admin/workers/{{ worker_id }}/health?level={{ health_level }}"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_velox_admin_token }}"
        validate_certs: true
        timeout: 60
        status_code: 200
      register: probe
      failed_when: false

    - name: Print healthy probe report for {{ worker_id }}
      ansible.builtin.debug:
        msg: >-
          [{{ worker_id }}] level={{ health_level }} passed=
          {{ probe.json.passed | default('—') }} detail=
          {{ probe.json.detail | default('—') }}
      when: probe.status == 200 and probe.json.passed | default(false)

    - name: Print degraded probe report for {{ worker_id }}
      ansible.builtin.debug:
        msg: >-
          [{{ worker_id }}] level={{ health_level }} FAILED
          (passed={{ probe.json.passed | default(false) }}) —
          failing checks:
          {{ probe.json.checks | dict2items | selectattr('value.passed', 'equalto', false) | map(attribute='key') | list }}

    - name: Fail the play if any Level {{ health_level }} sub-check failed for {{ worker_id }}
      ansible.builtin.fail:
        msg: >-
          Level {{ health_level }} health probe for worker
          {{ worker_id }} has at least one sub-check that did
          not pass. Operator MUST triage before re-running
          fleet-* (or rolling forward via fleet-update).
      when:
        - probe.status == 200
        - not (probe.json.passed | default(false))
