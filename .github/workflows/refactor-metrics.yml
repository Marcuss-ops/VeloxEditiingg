# Reproducible refactoring metrics: LOC, complexity, duplication, responsibility.
# The analyzer is dependency-free and compares two Git refs using one versioned
# schema, so reports remain comparable across independent refactors on main.
name: refactor-metrics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: refactor-metrics-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  report:
    name: LOC / complexity / duplication / responsibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select comparison refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base='${{ github.event.pull_request.base.sha }}'
          elif [[ "${{ github.event_name }}" == "push" && '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]]; then
            base='${{ github.event.before }}'
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          git cat-file -e "${base}^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Run analyzer self-tests
        run: python3 -m unittest discover -s scripts/metrics -p 'test_*.py'

      - name: Generate comparable report
        run: |
          rm -rf metrics-out
          mkdir -p metrics-out
          python3 scripts/metrics/refactor_metrics.py \
            --base-ref '${{ steps.refs.outputs.base }}' \
            --head-ref '${{ steps.refs.outputs.head }}' \
            --out-dir metrics-out | tee metrics-out/ci-summary.txt

      - name: Publish job summary
        run: cat metrics-out/refactor-metrics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: refactor-metrics-${{ github.sha }}
          path: metrics-out/
          if-no-files-found: error
          retention-days: 90
