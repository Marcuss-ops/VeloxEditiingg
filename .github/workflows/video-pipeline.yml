# Dedicated video-pipeline gates. The repository-wide make verify remains the
# canonical integrity gate; this workflow exposes the video-specific failure
# domains as separate status checks and runs the hermetic media matrix.
name: video-pipeline

on:
  push:
    branches: [main]
    paths:
      - "DataServer/**"
      - "RemoteCodex/**"
      - "shared/**"
      - "tests/smoke/**"
      - "tests/e2e/workload/**"
      - "scripts/ci/**"
      - "Makefile"
      - ".github/workflows/video-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "DataServer/**"
      - "RemoteCodex/**"
      - "shared/**"
      - "tests/smoke/**"
      - "tests/e2e/workload/**"
      - "scripts/ci/**"
      - "Makefile"
      - ".github/workflows/video-pipeline.yml"
  workflow_dispatch:

concurrency:
  group: video-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  video-go-tests:
    name: video Go tests (race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            DataServer/go.sum
            RemoteCodex/native/worker-agent-go/go.sum
            shared/go.sum

      - name: Test worker video compiler and native client
        working-directory: RemoteCodex/native/worker-agent-go
        run: go test -race -count=1 -timeout 180s ./pkg/video/...

      - name: Test canonical render-plan and payload contracts
        working-directory: DataServer
        run: >-
          go test -race -count=1 -timeout 180s
          ./internal/jobs/enqueue/...
          ./internal/handlers/server/pipeline/...

  native-video-engine:
    name: native engine (CTest + RenderPlan smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native media dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ffmpeg pkg-config libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
          cmake --version
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Run CTest and canonical RenderPlan smoke
        env:
          VIDEO_SMOKE_JOB_DIR: ${{ runner.temp }}/velox-native-render
          VIDEO_SMOKE_BUILD_DIR: ${{ runner.temp }}/velox-native-render-build
          VIDEO_SMOKE_KEEP: "1"
        run: make video-smoke

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-pipeline-native-evidence
          path: |
            ${{ runner.temp }}/velox-native-render/
            ${{ runner.temp }}/velox-native-render-build/Testing/
          retention-days: 7
          if-no-files-found: warn

  zero-render-gate:
    name: zero-render release gate (visual replacement)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native media dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ffmpeg pkg-config libavformat-dev libavcodec-dev libavutil-dev libswscale-dev python3
          cmake --version
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Run zero-render release gate
        env:
          VIDEO_ZERO_RENDER_BUILD_DIR: ${{ runner.temp }}/velox-zero-render-build
          VIDEO_ZERO_RENDER_EVIDENCE: ${{ runner.temp }}/velox-zero-render-evidence
          VIDEO_ZERO_RENDER_KEEP: "1"
        run: bash scripts/ci/check-zero-render-gate.sh

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-pipeline-zero-render-evidence
          path: |
            ${{ runner.temp }}/velox-zero-render-evidence/
          retention-days: 7
          if-no-files-found: warn

  copy-vs-encode-benchmark:
    name: copy-vs-encode benchmark (visual replacement)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native media dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ffmpeg pkg-config libavformat-dev libavcodec-dev libavutil-dev libswscale-dev python3
          cmake --version
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Run copy-vs-encode benchmark gate
        env:
          VIDEO_BENCH_BUILD_DIR: ${{ runner.temp }}/velox-copy-vs-encode-build
          VIDEO_BENCH_EVIDENCE: ${{ runner.temp }}/velox-copy-vs-encode-evidence
          VIDEO_BENCH_KEEP: "1"
        run: bash scripts/ci/check-copy-vs-encode-benchmark.sh

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-pipeline-copy-vs-encode-evidence
          path: |
            ${{ runner.temp }}/velox-copy-vs-encode-evidence/
          retention-days: 7
          if-no-files-found: warn

  media-contract-smokes:
    name: media contract smoke matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg/libass smoke dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg jq python3 tesseract-ocr fonts-dejavu
          ffmpeg -version | head -1
          ffprobe -version | head -1
          tesseract --version | head -1

      - name: Run audio, subtitle sync, character and style smokes
        env:
          MEDIA_SMOKE_DIR: ${{ runner.temp }}/velox-media-smoke
        run: make media-smoke

      - name: Upload media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-pipeline-media-evidence
          path: ${{ runner.temp }}/velox-media-smoke/
          retention-days: 7
          if-no-files-found: warn
