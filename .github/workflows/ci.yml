name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: DataServer/go.mod
      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('DataServer/go.sum', 'RemoteCodex/native/worker-agent-go/go.sum', 'shared/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Guard — compute-outcome labels
        run: ./scripts/ci/check-compute-outcome-labels.sh
      - name: Guard — conflict-budget call pattern
        run: ./scripts/ci/check-conflict-budget-call-pattern.sh
      - name: Guard — sql-ownership shape
        run: ./scripts/ci/check-sql-ownership.sh
      - name: Guard — dsn busy-timeout shape
        run: ./scripts/ci/check-dsn-busy-timeout.sh
      - name: Verify — architecture, Go, native and Docker
        run: make verify
      - name: Invariants — completion protocol
        shell: bash
        run: |
          set -euo pipefail
          DB="$(mktemp /tmp/velox-cp-fixture.XXXXXX.db)"
          trap 'rm -f "$DB"' EXIT
          (cd DataServer && go run ./cmd/seed-velox-db-fixture "$DB")
          ./scripts/ci/check-completion-protocol-invariants.sh "$DB"
      - name: Self-test — AC/TaskResult convergence gate
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/check-ac-taskresult-convergence.sh
          bash -n scripts/e2e/verify-ac-taskresult-convergence.sh
          ./scripts/ci/test-ac-taskresult-convergence.sh
      - name: LOC threshold gate
        # ====== DELIBERATE REDUNDANCY — DO NOT REMOVE ======
        # This step is intentionally redundant with the dedicated
        # `loc-thresholds` workflow (`.github/workflows/loc-thresholds.yml`).
        # The dedicated workflow is the authoritative required status check;
        # this in-job run provides a second inline signal in the verify logs
        # for fast local debugging. Both invocations call the same script on
        # the same checkout, so the two views cannot disagree. If you are
        # cleaning up and tempted to remove this step, do not — first
        # update the duplication rationale in the loc-thresholds workflow
        # README + §10c of `docs/metrics/loc-baseline.md`.
        if: always()
        run: bash scripts/ci/check-loc-thresholds.sh

