name: Master image fast (benchmark)

# Deliberately separate from the certified release workflow. This path is for
# short edit → image → benchmark loops only; it never creates a release tag
# and never bypasses the release signing/attestation gate.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch to build (default: main)'
        required: false
        default: 'main'
      push:
        description: 'Push the benchmark image to GHCR'
        required: false
        default: true
        type: boolean

concurrency:
  group: master-fast-benchmark
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: velox-server

jobs:
  build:
    name: Fast cached benchmark image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push != false
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute benchmark tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}:bench-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build fast benchmark image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DataServer/Dockerfile
          push: ${{ inputs.push != false }}
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            VERSION=bench-${{ steps.meta.outputs.sha }}
            BUILD_COMMIT=${{ steps.meta.outputs.sha }}
          # The cache is useful here; attestations are intentionally release-only.
          cache-from: type=gha,scope=velox-master-fast
          cache-to: type=gha,mode=min,scope=velox-master-fast
          provenance: false
          sbom: false

      - name: Publish digest
        if: steps.build.outputs.digest != ''
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.build.outputs.digest }}' > image-digest.txt
          {
            echo '## Fast benchmark image'
            echo '- image: `${{ steps.meta.outputs.image }}`'
            echo '- digest: `${{ steps.build.outputs.digest }}`'
            echo '- commit: `${{ steps.meta.outputs.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest artifact
        if: steps.build.outputs.digest != ''
        uses: actions/upload-artifact@v4
        with:
          name: master-fast-image-digest
          path: image-digest.txt
          if-no-files-found: error
