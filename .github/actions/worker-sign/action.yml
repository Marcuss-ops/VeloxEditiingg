name: Worker image signing
description: Sign and verify a published worker image digest with Cosign keyless OIDC.
inputs:
  image-repo:
    description: Fully qualified worker image repository.
    required: true
  digest:
    description: Immutable image digest to sign and verify.
    required: true
  push:
    description: Whether signing is enabled for this run.
    required: true
runs:
  using: composite
  steps:
    - name: Install pinned cosign release via GitHub asset API
      if: inputs.digest != '' && inputs.push == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        asset_id=660069428 # sigstore/cosign v3.1.4 linux-amd64 release asset
        expected_sha256=424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        binary="$RUNNER_TEMP/cosign"
        curl --retry 6 --retry-delay 5 --retry-all-errors --retry-max-time 120 \
          --fail --location --silent --show-error \
          -H 'Accept: application/octet-stream' \
          -H 'X-GitHub-Api-Version: 2022-11-28' \
          -H "Authorization: Bearer $GH_TOKEN" \
          "https://api.github.com/repos/sigstore/cosign/releases/assets/$asset_id" \
          --output "$binary"
        echo "$expected_sha256  $binary" | sha256sum --check --status
        chmod 0755 "$binary"
        printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Cosign keyless sign (OIDC)
      if: inputs.digest != '' && inputs.push == 'true'
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: '1'
      run: |
        set -euo pipefail
        IMAGE="${{ inputs.image-repo }}@${{ inputs.digest }}"
        echo "Signing image: $IMAGE"
        cosign sign --yes "$IMAGE"

    # The identity policy is intentionally pinned to this repository's
    # worker-image workflow and the Actions OIDC issuer.
    - name: Cosign keyless verify (OIDC, Phase 1)
      if: inputs.digest != '' && inputs.push == 'true'
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: '1'
      run: |
        set -euo pipefail
        IMAGE="${{ inputs.image-repo }}@${{ inputs.digest }}"
        echo "Verifying image: $IMAGE"
        cosign verify \
          --certificate-identity-regexp='^https://github.com/Marcuss-ops/VeloxEditiingg/\.github/workflows/worker-image\.yml@refs/(tags/worker-v.+|heads/.+)' \
          --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
          "$IMAGE"
