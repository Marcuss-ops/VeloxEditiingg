name: Worker image signing
description: Sign and verify a published worker image digest with Cosign keyless OIDC.
inputs:
  image-repo:
    description: Fully qualified worker image repository.
    required: true
  digest:
    description: Immutable image digest to sign and verify.
    required: true
  push:
    description: Whether signing is enabled for this run.
    required: true
runs:
  using: composite
  steps:
    - name: Install pinned cosign v2.4.1 via GitHub asset API
      if: inputs.digest != '' && inputs.push == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        binary="$RUNNER_TEMP/cosign"
        signature="$RUNNER_TEMP/cosign.sig"
        public_key="$RUNNER_TEMP/cosign-release.pub"
        curl_api_asset() {
          curl --retry 6 --retry-delay 5 --retry-all-errors --retry-max-time 120 \
            --fail --location --silent --show-error \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/sigstore/cosign/releases/assets/$1" \
            --output "$2"
        }
        curl_api_asset 196693045 "$binary" # cosign-linux-amd64
        curl_api_asset 196693204 "$signature" # detached release signature
        curl --retry 6 --retry-delay 5 --retry-all-errors --retry-max-time 120 \
          --fail --location --silent --show-error \
          -H 'X-GitHub-Api-Version: 2022-11-28' \
          -H "Authorization: Bearer $GH_TOKEN" \
          'https://api.github.com/repos/sigstore/cosign/contents/release/release-cosign.pub?ref=v2.4.1' \
          | jq -er '.content' | base64 --decode > "$public_key"
        echo '8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  '"$binary" \
          | sha256sum --check --status
        echo 'f4cea466e5e887a45da5031757fa1d32655d83420639dc1758749b744179f126  '"$public_key" \
          | sha256sum --check --status
        chmod 0755 "$binary"
        "$binary" verify-blob --key "$public_key" --signature "$signature" "$binary"
        printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Cosign keyless sign (OIDC)
      if: inputs.digest != '' && inputs.push == 'true'
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: '1'
      run: |
        set -euo pipefail
        IMAGE="${{ inputs.image-repo }}@${{ inputs.digest }}"
        echo "Signing image: $IMAGE"
        cosign sign --yes "$IMAGE"

    # The identity policy is intentionally pinned to this repository's
    # worker-image workflow and the Actions OIDC issuer.
    - name: Cosign keyless verify (OIDC, Phase 1)
      if: inputs.digest != '' && inputs.push == 'true'
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: '1'
      run: |
        set -euo pipefail
        IMAGE="${{ inputs.image-repo }}@${{ inputs.digest }}"
        echo "Verifying image: $IMAGE"
        cosign verify \
          --certificate-identity-regexp='^https://github.com/Marcuss-ops/VeloxEditiingg/\.github/workflows/worker-image\.yml@refs/(tags/worker-v.+|heads/.+)' \
          --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
          "$IMAGE"
